  raw_text: The biquad circuit has the ability to realize both complex poles and complex zeros. The poles are generated by the primary feedback path which generally consists of a noninverting integrator and an inverting integrator. One of the integrators is damped to avoid oscillation. The zeros are generated by how the input signal is applied to circuit.
  normalized_text: A biquad realizes both complex poles and complex zeros. The poles come from the primary feedback path - generally a noninverting integrator plus an inverting integrator, one of which is damped to avoid oscillation. The zeros come from how the input signal is applied.
