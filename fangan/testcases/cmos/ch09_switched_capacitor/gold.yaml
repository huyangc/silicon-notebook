- id: PRINCIPLE-CAP-RATIO
  type: DesignPrinciple
  section_path: '9'
  home_package: PKG-OV
  payload:
    statement: SC signal-processing accuracy is proportional to the accuracy of capacitor RATIOS (not absolute R/C values); capacitor ratios are the most accurate aspect of CMOS, which is why SC techniques work.
    applies_to:
    - analog signal processing in CMOS
    - time-constant accuracy
  local_evidence_atom_ids:
  - A-INTRO-ACCURACY
  supporting_context_atom_ids:
  - A-SC-ACC-TAUD-22
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: PRINCIPLE-INTEGRATOR-BASIS
  type: DesignPrinciple
  section_path: 9 > 9.3
  home_package: PKG-INT
  payload:
    statement: All filter design can be reduced to noninverting and inverting integrators; pairing them in a loop also cancels their phase errors.
    applies_to:
    - SC filter synthesis
  local_evidence_atom_ids:
  - A-INT-ROLE
  - A-INT-PHASE-CANCEL
  supporting_context_atom_ids: []
