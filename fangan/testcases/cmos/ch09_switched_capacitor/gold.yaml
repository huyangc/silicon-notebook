    char_end: 223841
    viewer_only: true
  raw_text: The second major approach to designing higher-order, switched capacitor circuits shown in Fig. 9.7-6 is called the ladder approach. It has the advantage of being less sensitive to the capacitor ratios than the cascade approach. Its disadvantage is that the design approach is slightly more complex and is only applicable to filters that can be expressed as RLC circuits. The ladder approach begins with the normalized, low pass, RLC prototype filter structure. Next, state equations are written based on the RLC prototype circuit. Lastly, the state equations are synthesized using the appropriate switched capacitor circuits.
  normalized_text: 'Ladder approach: begins with a normalized lowpass RLC prototype, writes state equations from the RLC circuit, and synthesizes them with the appropriate switched capacitor circuits. Advantage: less sensitive to capacitor ratios than the cascade approach. Disadvantage: more complex and only applicable to filters expressible as RLC circuits.'
  evidence_strength: direct
