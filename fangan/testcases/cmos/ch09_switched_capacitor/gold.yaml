  raw_text: One approach to designing higher order filters is to take the design in polynomial form and break it into products of second-order products. If the filter order is odd, then one first-order product will result. The implementation of each product can then be accomplished by a cascade of second-order circuits that each individually realize a pair of complex conjugate poles and two zeros (which may be at infinity or zero or in between).
  normalized_text: Higher-order filters are realized by factoring the transfer function into products of second-order functions, each implemented as a cascade of second-order circuits realizing a pair of complex-conjugate poles and two zeros; if the order is odd, one first-order product remains.
  evidence_strength: direct
