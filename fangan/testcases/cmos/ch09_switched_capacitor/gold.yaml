  evidence_strength: direct
- id: PRINCIPLE-PARASITIC-INSENSITIVE
  type: DesignPrinciple
  section_path: 9 > 9.2
  home_package: PKG-SCAMP
  payload:
    statement: Use positive/negative transresistance circuits so capacitor parasitics sit at a virtual ground or are shorted, making SC amplifiers/integrators insensitive to parasitic capacitance.
    applies_to:
    - SC amplifier
    - SC integrator
  local_evidence_atom_ids:
  - A-SCAMP-PARASITIC
  - A-SCAMP-NOEXCESS
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: PRINCIPLE-FEEDTHRU-FIX
  type: DesignPrinciple
  section_path: 9 > 9.2
  home_package: PKG-FEEDTHRU
  payload:
    statement: Remove the constant feedthrough term by autozeroing and the input-dependent (distortion) term by delaying/modifying the clocks; differential circuits further reduce feedthrough.
    applies_to:
    - SC amplifier
    - SC integrator
    - first-order circuits
    tradeoff: differential operation doubles component count and amplifier complexity
  local_evidence_atom_ids:
  - A-SCAMP-FEEDTHRU-FIX
  supporting_context_atom_ids:
  - A-FO-DIFF
  - A-FO-DIFF-COST
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: PRINCIPLE-OVERSAMPLING
  type: DesignPrinciple
  section_path: '9'
  home_package: PKG-OV
  payload:
    statement: The clock frequency must be much greater than the signal bandwidth (oversampling) so the sampled-data and continuous-time domains are equivalent; this also limits SC filters to signal bands well below op-amp bandwidths.
    applies_to:
    - all SC circuits
  local_evidence_atom_ids:
  - A-SUMMARY
  supporting_context_atom_ids:
  - A-SC-REQ-12
  gold_label: true
  difficulty: medium
  evidence_strength: indirect
