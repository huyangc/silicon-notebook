objects:
- id: CONCEPT-SC-CIRCUIT
  type: Concept
  section_path: '9'
  home_package: PKG-OV
  payload:
    term: switched capacitor circuit
    definition: Analog sampled-data circuit (continuous in amplitude, discrete in time) of MOSFET switches, capacitors and op amps that emulates resistors/time-constants for analog signal processing in CMOS.
  local_evidence_atom_ids:
  - A-INTRO
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: CONCEPT-NONOVERLAP-CLOCK
  type: Concept
  section_path: 9 > 9.1
  home_package: PKG-RES-EMU
  payload:
    term: two-phase nonoverlapping clock
    definition: Clocks phi_1, phi_2 never at logic 1 simultaneously; period T, each phase < T/2; controls the switches.
  local_evidence_atom_ids:
  - A-SC-NONOVERLAP
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: CONCEPT-Z-MODEL
  type: Concept
  section_path: 9 > 9.4
  home_package: PKG-ZMODEL
  payload:
    term: z-domain model of SC circuit
    definition: Decomposition of time-variant SC circuits into time-invariant z-domain models for analysis and SPICE-type frequency simulation.
  local_evidence_atom_ids:
  - A-Z-MODEL-CONCEPT
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: CONCEPT-BIQUAD
  type: Concept
  section_path: 9 > 9.6
  home_package: PKG-SECONDORDER
  payload:
    term: biquad
    definition: Second-order section realizing complex poles (from two integrators, one damped) and complex zeros (from how the input is applied).
  local_evidence_atom_ids:
  - A-SO-BIQUAD-CONCEPT
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-REQ
  type: Formula
  section_path: 9 > 9.1
  home_package: PKG-RES-EMU
  payload:
    name: switched-capacitor equivalent resistance
    expression: R = T/C = 1/(f_c C)
    variables:
      T: clock period
      C: switched capacitor
      f_c: clock frequency
    condition: v_1,v_2 nearly constant over T (f signal << f clock)
  local_evidence_atom_ids:
  - A-SC-REQ-12
  - A-SC-IAVG-10
  - A-SC-IAVG-6
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-REQ-SP
  type: Formula
  section_path: 9 > 9.1
  home_package: PKG-RES-EMU
  payload:
    name: series-parallel SC equivalent resistance
    expression: R = T/(C_1 + C_2)
  local_evidence_atom_ids:
  - A-SC-REQ-SP-17
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-TAUD-ACC
  type: Formula
  section_path: 9 > 9.1
  home_package: PKG-ACCURACY
  payload:
    name: SC time-constant accuracy
    expression: d(tau_D)/tau_D = dC_2/C_2 - dC_1/C_1 - df_c/f_c
    note: as small as 0.1% in CMOS vs 5-20% for continuous-time tau_C
  local_evidence_atom_ids:
  - A-SC-ACC-TAUD-22
  - A-SC-ACC-TAUC-20
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-SC-LPF
  type: Formula
  section_path: 9 > 9.1
  home_package: PKG-Z-ANALYSIS
  payload:
    name: SC first-order lowpass transfer function
    expression: H^oo(z) = z^-1/(1 + alpha - alpha z^-1), alpha = C_2/C_1
  local_evidence_atom_ids:
  - A-SC-LPF-HZ-37
  - A-SC-ZTRANS-25
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-SC-AMP-GAIN
  type: Formula
  section_path: 9 > 9.2
  home_package: PKG-SCAMP
  payload:
    name: switched-capacitor amplifier gain
    expression: H(z) = V_out/V_in = -(C_1/C_2) z^-1  (magnitude = C_1/C_2, set by a capacitor ratio)
    variables:
      C_1: input capacitor
      C_2: feedback capacitor
  local_evidence_atom_ids:
  - A-SCAMP-HZ-19
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-TRANSRES
  type: Formula
  section_path: 9 > 9.2
  home_package: PKG-SCAMP
  payload:
    name: parasitic-insensitive SC transresistance
    expression: R_T = +/- T/C
    condition: f_c >> f
  local_evidence_atom_ids:
  - A-SCAMP-TRANSR-28
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-FEEDTHRU
  type: Formula
  section_path: 9 > 9.2
  home_package: PKG-FEEDTHRU
  payload:
    name: clock-feedthrough output
    expression: v_out ~= (C_1/C_2) v_in - (C_OL/2C_2) v_in + (C_OL/C_2) V_T
    note: ideal term + input-dependent (distortion) term + constant (offset) term
  local_evidence_atom_ids:
  - A-SCAMP-FEEDTHRU-50
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-INT-NONINV
  type: Formula
  section_path: 9 > 9.3
  home_package: PKG-INT
  payload:
    name: noninverting SC integrator transfer function
    expression: H^oo(z) = (C_1/C_2) z^-1/(1 - z^-1)
  local_evidence_atom_ids:
  - A-INT-NONINV-16
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-INT-INV
  type: Formula
  section_path: 9 > 9.3
  home_package: PKG-INT
  payload:
    name: inverting SC integrator transfer function
    expression: H^ee(z) = -(C_1/C_2) 1/(1 - z^-1)
  local_evidence_atom_ids:
  - A-INT-INV-24
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-INT-WI
  type: Formula
  section_path: 9 > 9.3
  home_package: PKG-INT
  payload:
    name: integrator frequency
    expression: w_I = C_1/(T C_2) = (C_1/C_2) f_c
    note: well defined because proportional to a capacitor ratio
  local_evidence_atom_ids:
  - A-INT-WI-19
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-INT-AVD-ERR
  type: Formula
  section_path: 9 > 9.3
  home_package: PKG-INT-NONIDEAL
  payload:
    name: integrator finite-gain magnitude/phase error
    expression: m(jw) = -(1/A_vd(0))[1 + C_1/(2C_2)]; theta(jw) = (C_1/C_2)/(2 A_vd(0) tan(wT/2))
  local_evidence_atom_ids:
  - A-INT-AVD-ERR-36
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: hard
  evidence_strength: direct
- id: FORMULA-KTC
  type: Formula
  section_path: 9 > 9.3
  home_package: PKG-INT-NONIDEAL
  payload:
    name: kT/C switch noise
    expression: v_Ron^2 = kT/C Volts(rms)^2
  local_evidence_atom_ids:
  - A-INT-KTC-41
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-Z-ADMITTANCE
  type: Formula
  section_path: 9 > 9.4
  home_package: PKG-ZMODEL
  payload:
    name: z-domain admittance types
    expression: I=YV; I=Y z^-1/2 V; I=(1-z^-1) Y V; Y = switched capacitor value C
  local_evidence_atom_ids:
  - A-Z-ADMITTANCE
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-FO-LP
  type: Formula
  section_path: 9 > 9.5
  home_package: PKG-FIRSTORDER
  payload:
    name: first-order SC lowpass
    expression: V_o^o(z)/V_i^o(z) = alpha_1 z^-1/(1 + alpha_2 - z^-1); alpha_1=A_0/B_0, alpha_2=(1-B_0)/B_0
  local_evidence_atom_ids:
  - A-FO-LP-4
  - A-FO-HS-1
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-BIQUAD-HS
  type: Formula
  section_path: 9 > 9.6
  home_package: PKG-SECONDORDER
  payload:
    name: continuous-time biquad transfer function
    expression: H_a(s) = -(K_2 s^2 + K_1 s + K_0)/(s^2 + (w_o/Q) s + w_o^2)
  local_evidence_atom_ids:
  - A-SO-BIQUAD-HS-1
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-BIQUAD-ALPHA
  type: Formula
  section_path: 9 > 9.6
  home_package: PKG-SECONDORDER
  payload:
    name: low-Q biquad capacitor ratios
    expression: alpha_1=K_0 T/w_o, alpha_2=|alpha_5|=w_o T, alpha_3=K_2, alpha_4=K_1 T, alpha_6=w_o T/Q
  local_evidence_atom_ids:
  - A-SO-BIQUAD-ALPHA-11
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: hard
  evidence_strength: direct
- id: BLOCK-SC-RESISTOR
  type: CircuitBlock
  section_path: 9 > 9.1
  home_package: PKG-RES-EMU
  payload:
