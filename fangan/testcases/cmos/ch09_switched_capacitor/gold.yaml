    char_start: 195750
    char_end: 196231
    viewer_only: true
  raw_text: All approaches start with a normalized, low pass filter with a passband of 1 radian/second and an impedance of 1Ω that will satisfy the filter specification. In the cascade approach, the root locations for the desired are identified and then transformed to the roots of an unnormalized low pass realizations. If the filter is to be low pass, then these roots are grouped into products of second-order functions. If the filter order is odd, then one first-order product is required.
  normalized_text: 'Cascade approach: start from a normalized lowpass prototype (passband 1 rad/s, impedance 1 Ohm); identify the root locations, transform them to an unnormalized lowpass realization, and group the roots into products of second-order functions (one first-order product if the order is odd).'
  evidence_strength: direct
- id: A-FILT-LADDER
  section_id: SEC-9.7
  atom_type: design_principle_atom
  source_element_id: SE-9.7-LADDER
