# Gold fixture v0.3.3-textbook - CMOS Analog Circuit Design Chapter 9 Switched Capacitor Circuits (profile: textbook)
# Upgraded from v0.1: dual coordinates (source_span authoritative + viewer_span), verbatim raw_text +
# within-span normalized_text (formula/condition normalized are formula-only), object evidence split into
# local/supporting + home_package, ONE context_package per chunk with expected_objects (+ expected_local_fields
# for cross-package objects), gold_label/difficulty/evidence_strength (no decimal confidence), do_not_extract
# negatives, source_meta conventions/validation/parsing_notes. Same atom/chunk/object/relation IDs and meaning
# as v0.1. Spans are computed by build.py against the MinerU .md; do NOT hand-edit.
