  profile_cues:
  - Chapter 9
  - Example 9.1-1
  - Example 9.2-4
  - Eq. (12)
  - Fig. 9.1-1
  - Table 9.1-1
  - 9.8 - Summary
  - Homework Problems
  extraction_targets:
  - Concept
