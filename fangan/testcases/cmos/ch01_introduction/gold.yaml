  raw_text: Complementary metal-oxide semiconductor (CMOS) technology has been the mainstay in mixed-signal1 implementations because it provides density and power savings on the digital side, and a good mix of components for analog design. By reason of its wide-spread use, CMOS technology is the subject of this text.
  normalized_text: VLSI now integrates complete systems combining analog and digital functions on one chip. CMOS is the mainstay for mixed-signal designs (density/power on the digital side, a good mix of components for analog) and is the subject of this text.
  evidence_strength: direct
  context_only: true
- id: A-INTRO-CAD
  section_id: SEC-1
  atom_type: concept_definition_atom
  source_element_id: SE-1-P0B
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 7
    line_end: 7
    char_start: 755
    char_end: 1107
  viewer_span:
    file: source.md
    line_start: 6
    line_end: 6
    char_start: 935
    char_end: 1287
    viewer_only: true
  raw_text: Due in part to the regularity and granularity of digital circuits, computer aided design (CAD) methodologies have been very successful in automating the design of digital systems given a behavioral description of the function desired. Such is not the case for analog circuit design. Analog design still requires a “hands on” design approach in general.
  normalized_text: CAD methodologies automate digital design from a behavioral description; analog design still requires a hands-on approach, so this book gives a hierarchical organization and general principles of analog IC design.
  evidence_strength: direct
  context_only: true
- id: A-SIG-DEF
