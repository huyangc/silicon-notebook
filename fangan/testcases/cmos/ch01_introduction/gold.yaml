    char_end: 3043
    viewer_only: true
  raw_text: An analog signal is a signal that is defined over a continuous range of time and a continuous range of amplitudes. An analog signal is illustrated in Fig. 1.1-1(a).
  normalized_text: An analog signal is defined over a continuous range of time AND a continuous range of amplitudes (Fig. 1.1-1a).
  evidence_strength: direct
- id: A-SIG-DIGITAL
  section_id: SEC-1.1
  atom_type: concept_definition_atom
  source_element_id: SE-1.1-SIGDEF
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
