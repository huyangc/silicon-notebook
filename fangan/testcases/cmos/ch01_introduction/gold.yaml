  raw_text: 12. Consider an ideal voltage amplifier with a voltage gain of $A _ { \nu } = 0 . 9 9$ . A resistance R = 50 kΩ is connected from the output back to the input. Find the input resistance of this circuit by applying the Miller simplification concept.
