    char_start: 24373
    char_end: 24600
    viewer_only: true
  raw_text: The first step in the design of an analog signal-processing system is to examine the specifications and decide what part of the system should be analog and what part should be digital. In most cases, the input signal is analog.
  normalized_text: The first design step is to decide which part of the system is analog and which is digital; digital processing offers smallest-geometry cost/speed, extra freedom (e.g. linear-phase filters), and programmability. Analog circuits rarely stand alone but combine with digital to perform signal processing.
  evidence_strength: direct
