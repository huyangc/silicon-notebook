  raw_text: Figure 1.4-1 shows the block diagram of a fully-integrated digital read/write channel for disk drive recording applications. The device employs partial response maximum likelihood (PRML) sequence detection when reading data to enhance bit-error-rate versus signal-to-noise ratio performance. The device supports data rates up to 64 Mbits/sec and is fabricated in a 0.8 m double-metal CMOS process.
  normalized_text: 'Worked example: a fully-integrated digital read/write channel IC for disk-drive recording, using PRML (partial-response maximum-likelihood) sequence detection, supporting data rates up to 64 Mbits/sec, fabricated in a 0.8 um single-polysilicon double-metal CMOS process.'
  evidence_strength: direct
