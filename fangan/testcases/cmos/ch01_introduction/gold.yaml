- id: A-ANALYSIS-DESIGN
  section_id: SEC-1.1
  atom_type: concept_definition_atom
  source_element_id: SE-1.1-ANADES
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 79
    line_end: 79
    char_start: 6109
    char_end: 6611
  viewer_span:
    file: source.md
    line_start: 78
    line_end: 78
    char_start: 6289
    char_end: 6791
    viewer_only: true
  raw_text: The analysis of a circuit, illustrated in Fig. 1.1-2(a), is the process by which one starts with the circuit and finds its properties. An important characteristic of the analysis process is that the solution or properties are unique. On the other hand, the synthesis or design of a circuit is the process by which one starts with a desired set of properties and finds a circuit that satisfies them. In a design problem the solution is not unique thus giving opportunity for the designer to be creative.
  normalized_text: Analysis starts with a circuit and finds its (unique) properties (Fig.1.1-2a). Synthesis/design starts with desired properties and finds a circuit satisfying them; the design solution is NOT unique, giving the designer room to be creative (Fig.1.1-2b).
  evidence_strength: direct
- id: A-IC-VS-DISCRETE
  section_id: SEC-1.1
  atom_type: design_principle_atom
  source_element_id: SE-1.1-ICDISC
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 109
    line_end: 109
    char_start: 7663
    char_end: 8694
  viewer_span:
    file: source.md
    line_start: 108
    line_end: 108
    char_start: 7843
    char_end: 8874
    viewer_only: true
  raw_text: The differences between integrated and discrete analog circuit design are important. Unlike integrated circuits, discrete circuits use active and passive components that are not on the same substrate. A major benefit of components sharing the same substrate in close proximity is that component matching can be used as a tool for design. Another difference between the two design methods is that the geometry of active devices and passive components in integrated circuit design are under the control of the designer. This control over geometry gives the designer a new degree of freedom in the design process. A second difference is due to the fact that it is impractical to breadboard the integrated-circuit design. Consequently, the designer must turn to computer simulation methods to confirm the design’s performance. Another difference between integrated and discrete analog design is that the integrated-circuit designer is restricted to a more limited class of components that are compatible with the technology being used.
  normalized_text: 'Integrated vs discrete analog design: shared substrate enables component matching as a design tool; device/component geometry is under the designer''s control; the IC cannot be breadboarded so the designer must rely on computer simulation; and only a limited, technology-compatible class of components is available.'
  evidence_strength: direct
- id: A-DESIGN-STEPS
  section_id: SEC-1.1
  atom_type: process_flow_atom
  source_element_id: SE-1.1-STEPS
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 111
    line_end: 119
    char_start: 8854
    char_end: 9107
  viewer_span:
    file: source.md
    line_start: 110
    line_end: 118
    char_start: 9034
    char_end: 9287
    viewer_only: true
  raw_text: "The major steps in the design process are:\n\n1. Definition   \n2. Synthesis or implementation   \n3. Simulation or modeling   \n4. Geometrical description   \n5. Simulation including the geometrical parasitics   \n6. Fabrication   \n7. Testing and verification"
  normalized_text: 'The major steps in the design process are: 1 Definition; 2 Synthesis or implementation; 3 Simulation or modeling; 4 Geometrical description; 5 Simulation including the geometrical parasitics; 6 Fabrication; 7 Testing and verification.'
  evidence_strength: direct
  metadata:
    note: verbatim 7-step numbered list (source lines 111-119). The 'designer responsible for all steps except fabrication' clause is restated verbatim on line 121 (A-DESIGN-SIM-PARASITIC's element); the normalized summary keeps it as the in-list designer-responsibility note.
