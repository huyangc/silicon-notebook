  raw_text: The first block of Fig. 1.3-1 is a preprocessing block. Typically, this block will consist of filters, an automatic-gain-control circuit, and an analogto-digital converter (ADC or A/D). Often, very strict speed and accuracy requirements are placed on the components in this block. The next block of the analog signal processor is a digital signal processor.
  normalized_text: 'A typical signal-processing system (Fig. 1.3-1) is a pipeline: analog input -> pre-processing (filters, AGC, A/D converter) -> digital signal processor -> post-processing (D/A converter, amplification, filtering) -> analog output.'
  evidence_strength: direct
- id: A-SP-ANALOG-DIGITAL
  section_id: SEC-1.3
  atom_type: design_principle_atom
  source_element_id: SE-1.3-PART
  source_span:
