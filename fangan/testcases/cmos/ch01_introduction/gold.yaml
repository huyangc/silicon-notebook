  raw_text: This chapter has presented an introduction to the design of CMOS analog integrated circuits. Section 1.1 gave a definition of signals in analog circuits and defined analog, digital, and analog sampled-data signals. The difference between analysis and design was discussed. The design differences between discrete and integrated analog circuits are primarily due to the designer’s control over circuit geometry and the need to computersimulate rather than build a breadboard. The first section also presented an overview of the text and showed in Table 1.1-2 how the various chapters tied together.
