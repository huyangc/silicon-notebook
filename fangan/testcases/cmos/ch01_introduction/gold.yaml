    char_end: 2878
    viewer_only: true
  raw_text: A signal will be considered to be any detectable value of voltage, current, or charge. A signal should convey information about the state or behavior of a physical system.
  normalized_text: A signal is any detectable value of voltage, current, or charge that conveys information about a physical system.
  evidence_strength: direct
- id: A-SIG-ANALOG
  section_id: SEC-1.1
  atom_type: concept_definition_atom
  source_element_id: SE-1.1-SIGDEF
  source_span:
