    char_start: 3044
    char_end: 3448
    viewer_only: true
  raw_text: A digital signal is a signal that is defined only at discrete values of amplitude, or said another way, a digital signal is quantized to discrete values. Typically, the digital signal is a binary-weighted sum of signals having only two defined values of amplitude as illustrated in Fig. 1.1-1(b) and shown in Eq. (1). Figure 1.1-1(b) is a 3-bit representation of the analog signal shown in Fig. 1.1-1(a).
  normalized_text: A digital signal is defined only at discrete values of amplitude (quantized); typically a binary-weighted sum of two-valued signals (Fig. 1.1-1b, Eq.(1)). Fig.1.1-1(b) is a 3-bit representation of the analog signal.
  evidence_strength: direct
