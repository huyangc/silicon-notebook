  raw_text: The designer makes approximations about the physical definition of the circuit initially. Later, once the layout is complete, simulations are checked using parasitic information derived from the layout. At this point, the designer may iterate using the simulation results to improve the circuit’s performance.
  normalized_text: Initially the designer simulates with approximations about the physical circuit; later, once layout is complete, simulations are re-checked using parasitic information extracted from the layout, and the designer iterates on these post-layout simulation results to improve performance before fabrication.
  evidence_strength: direct
