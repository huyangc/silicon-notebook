    viewer_only: true
  raw_text: 'In accomplishing the design steps described above, the designer works with three different types of description formats. These include: the design description, the physical description, and the model/simulation description. The format of the design description is the way in which the circuit is specified; the physical description format is the geometrical definition of the circuit; the model/simulation format is the means by which the circuit can be simulated.'
  normalized_text: 'The designer works in three description formats: design description (how the circuit is specified), physical description (geometrical definition), and model/simulation description (means to simulate).'
  evidence_strength: direct
