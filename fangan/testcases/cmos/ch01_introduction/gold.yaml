- id: A-EX-MASTERPLL
  section_id: SEC-1.4
  atom_type: design_principle_atom
  source_element_id: SE-1.4-PLL
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 461
    line_end: 461
    char_start: 33906
    char_end: 34650
  viewer_span:
    file: source.md
    line_start: 460
    line_end: 460
    char_start: 34086
    char_end: 34830
    viewer_only: true
  raw_text: The control-voltage, VCON, is derived from the “Master PLL” composed of a replica of the filter configured as a voltage-controlled oscillator in a phase-locked-loop configuration as illustrated in Fig. 1.4-3. The frequency of oscillation is inversely proportional to the characteristic time constant, $C / g _ { m }$ , of the replica filter’s stages. By forcing the oscillator to be phase and frequency-locked to an external frequency reference through variation of the VCON terminal voltage, the characteristic time constant is held fixed. To the extent that the circuit elements in the low-pass filter match those in the master filter, the characteristic time constants of the low-pass filter (and thus the frequency response) are also fixed.
  normalized_text: The low-pass filter is built from transconductance (g_m) stages and capacitors; VCON from a Master PLL (a replica filter as a VCO phase-locked to an external reference) holds the characteristic time constant C/g_m fixed, compensating for process/temperature/supply variation. Matching the LPF to the master filter fixes the frequency response.
  evidence_strength: direct
