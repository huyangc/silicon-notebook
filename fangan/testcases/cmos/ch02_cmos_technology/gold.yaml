- id: A-LATCHUP-PREVENT
  section_id: SEC-2.5
  atom_type: design_principle_atom
  source_element_id: SE-2.5-PREVENT
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2232
    line_end: 2232
    char_start: 145589
    char_end: 146354
  viewer_span:
    file: source.md
    line_start: 1493
    line_end: 1493
    char_start: 95513
    char_end: 96278
    viewer_only: true
  raw_text: To prevent latch-up, several standard precautions are taken. One approach is to keep the source/drain of the n-channel device as far away from the n-well as possible. This reduces the value of $\beta _ { N P N }$ and helps to prevent latch-up. Unfortunately, this is very costly in terms of area. A second approach is to reduce the values of $R _ { N }$ and $R _ { P } .$ . Smaller resistor values are helpful because more current must flow through them in order to forward bias the base-emitter regions of Q1 and Q2. These resistances can be reduced by surrounding the p-channel devices with a n+ guard ring connected to $V _ { D D }$ and by surrounding n-channel transistors with $\mathfrak { p } ^ { + }$ guard rings tied to $V _ { S S }$ as shown in Fig. 2.5-4.
  normalized_text: 'Latch-up prevention: keep the n-channel S/D far from the n-well (reduces beta_NPN, costs area); reduce R_N/R_P with n+ guard rings to V_DD around p-channel and p+ guard rings to V_SS around n-channel.'
  evidence_strength: direct
- id: A-ESD
  section_id: SEC-2.5
  atom_type: design_principle_atom
  source_element_id: SE-2.5-ESD
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2254
    line_end: 2254
    char_start: 147168
    char_end: 148455
  viewer_span:
    file: source.md
    line_start: 1515
    line_end: 1515
    char_start: 97092
    char_end: 98379
    viewer_only: true
  raw_text: Another important consideration of CMOS technology is the electrostatic discharge protection of the gates of transistors which are externally accessible. To prevent accidental destruction of the gate oxide, a resistance and two reverse-biased pn junction diodes are employed to form an input protection circuit. One of the diodes is connected with the n side to the highest circuit potential $( V _ { D D } )$ and the p side to the gate to be protected. The other diode is connected with the n side to the gate to be protected and the p side to the lowest circuit potential $( V _ { S S } )$ . This is illustrated in Fig. 2.5-5. For an n-well process, the first diode is usually made by a $\mathfrak { p } ^ { + }$ diffusion into the n- well. The second diode is made by a $\mathfrak { n } ^ { + }$ diffusion into the substrate. The resistor is connected between the external contact and the junction between the diodes and the gate to be protected. If a large voltage is applied to the input, one of the diodes will breakdown depending upon the polarity of the voltage. If the resistor is large enough, it will limit the breakdown current so that the diode is not destroyed. This circuit should be used whenever the gates of a transistor (or transistors) are taken to external circuits.
  normalized_text: 'ESD protection for externally-accessible gates: a series resistor plus two reverse-biased pn diodes (one to V_DD, one to V_SS) limit breakdown current and protect the gate oxide.'
  evidence_strength: direct
