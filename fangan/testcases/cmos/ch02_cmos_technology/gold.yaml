- id: A-SUMMARY
  section_id: SEC-2.7
  atom_type: summary_atom
  source_element_id: SE-2.7-P
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2854
