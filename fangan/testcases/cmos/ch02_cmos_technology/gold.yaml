- id: A-EX251-RESULT
  section_id: SEC-EX251
  atom_type: result_atom
  source_element_id: SE-EX251
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2305
