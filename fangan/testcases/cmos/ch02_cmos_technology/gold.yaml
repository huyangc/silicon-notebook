  raw_text: 'The second basic processing step is diffusion [13]. Diffusion in semiconductor material is the movement of impurity atoms at the surface of the material into the bulk of the material. Diffusion takes place at temperatures in the range of $8 0 0 ~ ^ { \circ } \mathrm { C }$ to $1 4 0 0 ~ ^ { \circ } \mathrm { C }$ in the same way as a gas diffuses in air. The concentration profile of the impurity in the semiconductor is a function of the concentration of the impurity at the surface and the time in which the semiconductor is placed in a high-temperature environment. There are two basic types of diffusion mechanisms which are distinguished by the concentration of the impurity at the surface of the semiconductor. One type of diffusion assumes that there is an infinite source of impurities at the surface $( N _ { 0 } \mathrm { { ^ { - } { } c m ^ { - 3 } } } )$ during the entire time the impurity is allowed to diffuse. The impurity profile for an infinite-source impurity as a function of diffusion time is given in Fig. 2.1-2(a). The second type of diffusion assumes that there is a finite source of impurities at the surface of the material initially. $\mathbf { A } \mathbf { t } \ t = 0$ this value is given by $N _ { 0 } .$ . However, as time increases, the impurity concentration at the surface decreases as shown in Fig. 2.1-2(b). In both cases, $N _ { B }$ is the pre-diffusion impurity concentration of the semiconductor.


    The infinite-source and finite-source diffusions are typical of predeposition and drive-in diffusions, respectively. The object of a predeposition diffusion is to place a large concentration of impurities near the surface of the material. There is a maximum impurity concentration that can be diffused into silicon depending upon the type of impurity. This maximum concentration is due to the solid solubility limit which is in the range of $5 \times 1 0 ^ { 2 0 }$ to $2 \times 1 0 ^ { 2 1 }$ atoms/cm 3. The drive-in diffusion follows the deposition diffusion and is used to drive the impurities deeper into the semiconductor. The crossover between the pre-diffusion impurity level and the diffused impurities of the opposite type defines the semiconductor junction. This junction is between a p-type and n-type material and is simply called a pn junction. The distance between the surface of the semiconductor and the junction is called the junction depth. Typical junction depths for diffusion can range from 0.1 m for predeposition type diffusions to greater than 10 m for drive-in type diffusions.'
  normalized_text: Diffusion moves surface impurity atoms into the bulk (800-1400 C); infinite-source (predeposition) vs finite-source (drive-in); the crossover with the opposite-type background defines the pn junction depth.
  evidence_strength: direct
- id: A-FAB-IMP
  section_id: SEC-2.1-IMP
  atom_type: technology_process_atom
  source_element_id: SE-2.1-IMP-P
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 839
    line_end: 841
    char_start: 60782
    char_end: 63095
