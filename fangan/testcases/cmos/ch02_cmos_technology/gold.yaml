- id: A-EX261-RESULT
  section_id: SEC-EX261
  atom_type: result_atom
  source_element_id: SE-EX261
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2730
    line_end: 2746
    char_start: 174544
    char_end: 175004
  viewer_span:
    file: source.md
    line_start: 1991
    line_end: 2007
    char_start: 124468
    char_end: 124928
    viewer_only: true
  raw_text: 'First calculate $\rho _ { \mathrm { s } }$


    $$

    \rho_ {\mathrm{S}} = \frac {\rho}{\mathrm{T}} = \frac {9 \times 1 0 ^ {- 4} \Omega \cdot \mathrm{cm}}{3 0 0 0 \times 1 0 ^ {- 8} \mathrm{cm}} = 3 0 \Omega / \square

    $$


    The number of squares of resistance, N, is


    $$

    \mathrm{N} = \frac {L}{W} = \frac {2 0 \mu \mathrm{m}}{0 . 8 \mu \mathrm{m}} = 2 5

    $$


    giving the total resistance as


    $$

    R = \rho_ {\mathrm{S}} \times \mathrm{N} = 3 0 \times 2 5 = 7 5 0 \Omega

    $$'
  normalized_text: rho_s = rho/T = 30 Ohm/sq; N = L/W = 25; R = rho_s x N = 750 Ohm.
  evidence_strength: direct
