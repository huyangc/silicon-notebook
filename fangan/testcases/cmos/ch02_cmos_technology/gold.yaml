    viewer_only: true
  raw_text: 'This increase is due to two conduction mechanisms that can take place in a reverse-biased junction between two heavily-doped semiconductors. The first current mechanism is called avalanche multiplication and is caused by the high electric fields present in the pn junction; the second is called Zener breakdown. Zener breakdown is a direct disruption of valence bonds in high electric fields. However, the Zener mechanism does not require the presence of an energetic ionizing carrier. The current in most breakdown diodes will be a combination of these two current mechanisms.


    If $i _ { R }$ is the reverse current in the pn junction and $\nu _ { R }$ is the reverse-bias voltage across the pn junction, then the actual reverse current $i _ { R A }$ can be expressed as


    $$

    i _ {R A} = M i _ {R} = \left[ \frac {1}{1 - (v _ {R} / B V) ^ {n}} \right] i _ {R} \tag {14}

    $$


    M is the avalanche multiplication factor and n is an exponent which adjusts the sharpness of the “knee” of the curve shown in Fig. 2.2-4. Typically, n varies between 3 and 6. If both sides of the pn junction are heavily doped, the breakdown will take place by tunneling, leading to the Zener breakdown, which generally occurs at voltages less than 6 volts.'
  normalized_text: 'Reverse breakdown arises from two mechanisms: avalanche multiplication (high field) and Zener breakdown (disruption of valence bonds by tunneling), the latter generally below 6 V.'
  evidence_strength: direct
