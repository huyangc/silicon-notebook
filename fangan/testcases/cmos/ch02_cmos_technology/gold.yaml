- id: A-CAP-DESIRED
  section_id: SEC-2.4-CAP
  atom_type: design_principle_atom
  source_element_id: SE-2.4-CAP-DESIRED
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 1856
    line_end: 1861
    char_start: 123539
    char_end: 124090
  viewer_span:
    file: source.md
    line_start: 1117
    line_end: 1122
    char_start: 73463
    char_end: 74014
    viewer_only: true
  raw_text: "A good capacitor is often required when designing analog integrated circuits. They are used as compensation capacitors in amplifier designs, as bandwidth-determining components in gm/C filters, as charge storage devices in switched-capacitor filters and digital-to-analog converters, and other places as well. The desired characteristics for capacitors used in these applications are given below:\n\n• Good matching accuracy   \n• Low voltage-coefficient   \n• High ratio of desired capacitance to parasitic capacitance   \n• High capacitance per unit area"
  normalized_text: 'Desired characteristics for analog capacitors: good matching accuracy, low voltage coefficient, high ratio of desired to parasitic capacitance, high capacitance per unit area.'
  evidence_strength: direct
- id: A-CAP-TYPES
  section_id: SEC-2.4-CAP
  atom_type: component_model_atom
  source_element_id: SE-2.4-CAP-TYPES
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 1863
    line_end: 1915
    char_start: 124092
    char_end: 127501
  viewer_span:
    file: source.md
    line_start: 1124
    line_end: 1176
    char_start: 74016
    char_end: 77425
    viewer_only: true
  raw_text: "Analog CMOS processes differentiate themselves from purely digital ones by providing capacitors that meet the above criteria. For such analog processes, there are basically two types of capacitors made available. One type of capacitor is formed using one of the available interconnect layer s (metal or polysilicon) on top of crystalline silicon separated by a dielectric (silicon dioxide layer). Figure 2.4-1(a) shows an example of this capacitor using polysilicon as the top conducting plate. In order to achieve a low voltagecoefficient capacitor, the bottom plate must be heavily-doped diffusion (similar to that of the source and drain). As the process was described in Sec. 2.3, such heavily-doped diffusion is normally not available underneath polysilicon because the source/drain implant step occurs after polysilicon is deposited and defined. To solve this problem, an extra implant step must be included prior to deposition of the polysilicon layer. The mask-defined implanted region becomes the bottom plate of the capacitor. The capacitance achieved using this technique is inversely proportional to gate oxide thickness. Typical values for a 0.8 m process are given in Table 2.4-1. This capacitor achieves a high capacitance per unit area and good matching performance, but has a significant voltage dependent parasitic capacitance to the substrate.\n\n![](images/399d1383c8805168881b014a4398d48564509c970cf62f1bbd5122da0d9e774c.jpg)\n\n<details>\n<summary>text_image</summary>\n\nSiO₂\nGate SiO₂\nMetal\nPolysilicon top plate\nFOX\nFOX\nn+ bottom-plate implant\np- substrate\n</details>\n\n![](images/fa12a5923a2f5949b7c0ba2ecacac8efb21cd92b263a2c8e852ced8c39963c2b.jpg)\n\n<details>\n<summary>text_image</summary>\n\nPolysilicon top plate\nPolysilicon bottom plate\nFOX\nInter-poly SiO₂\np- substrate\n</details>\n\n(b)\n\n![](images/f13820b4c64f9359d8ffb5f8cf05b40d90366a9679d9f52a8a767a31c3796ce0.jpg)\n\n<details>\n<summary>text_image</summary>\n\nSiO₂\nGate SiO₂\nMetal\nPolysilicon top plate\nFOX\nn- well\nFOX\np- substrate\nn+ diffusion\n</details>\n\n(c)   \nFigure 2.4-1 MOS capacitors. (a) Polysilicon-oxide-channel. (b) Polysilicon-oxide-polysilicon (c) Accumulation MOS capacitor.\n\nThe second type of capacitor available in analog-taylored processes is that formed by providing an additional polysilicon layer on top of gate polysilicon (separated by a dielectric). An example of a double polysilicon capacitor is illustrated in Fig. 2.4-1(b). The dielectric is formed by a thin silicon-dioxide layer which can only be produced by using several steps beyond the usual single polysilicon process. This capacitor does an excellent job of meeting the criteria set forth above. In fact, it is the best of all possible choices for high-performance capacitors. Typical values for a 0.8µm process are given in Table 2.4-1.\n\nA third type of capacitor is illustrated in Fig. 2.4-1(c). This capacitor is constructed by putting an n-well underneath an n-channel transistor. It is similar to the capacitor in Fig2.4-1(a) except that its bottom plate (the n-well) has a much higher resistivity. Because of this fact, it is not used in circuits where a low voltage coefficient is important. It is, however, often used when one terminal of the capacitor is connected to ground (or VSS). It offers a very high capacitance per unit area, it can be matched well, and is available in all CMOS processes because no unique steps or masks are required."
  normalized_text: 'Three analog capacitor types: (a) polysilicon-oxide over an n+ bottom-plate implant (high C/area, good matching, voltage-dependent parasitic); (b) double-polysilicon (best high-performance choice); (c) accumulation MOS capacitor (n-well bottom plate, higher resistivity, used when one terminal is at ground/VSS).'
  evidence_strength: direct
- id: A-CAP-COEFF
  section_id: SEC-2.4-CAP
  atom_type: physical_effect_atom
  source_element_id: SE-2.4-CAP-COEFF
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2013
    line_end: 2013
    char_start: 131157
    char_end: 131738
  viewer_span:
    file: source.md
    line_start: 1274
    line_end: 1274
    char_start: 81081
    char_end: 81662
    viewer_only: true
  raw_text: The voltage coefficient of integrated capacitors generally falls within the range of 0 to −200 ppm/V depending upon the structure of the capacitor and, if applicable, the doping concentration of the capacitor plates [32]. The temperature coefficient of integrated capacitors is found to be in the range of 20 to 50 ppm/°C. When considering the ratio of two capacitors on the same substrate, note that the variations on the absolute value of the capacitor due to temperature tend to cancel. Therefore temperature variations have little effect on the matching accuracy of capacitors.
  normalized_text: Integrated-capacitor voltage coefficient is 0 to -200 ppm/V; temperature coefficient 20-50 ppm/C; in a capacitor ratio the absolute temperature variations tend to cancel, so temperature has little effect on matching.
  evidence_strength: direct
- id: A-RES-TYPES
  section_id: SEC-2.4-RES
  atom_type: component_model_atom
  source_element_id: SE-2.4-RES-TYPES
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2035
    line_end: 2039
    char_start: 133939
    char_end: 135480
  viewer_span:
    file: source.md
    line_start: 1296
    line_end: 1300
    char_start: 83863
    char_end: 85404
    viewer_only: true
  raw_text: 'A diffused resistor is formed using source/drain diffusion and is shown in Fig. 2.4-4(a). The sheet resistance of such resistors in a non-salicided process is usually in the range of 50 to 150 Ω/❑ (Ohms per square as explained in Sec 2.6). For a salicide process, these resistors are in the range of 5 to 15 Ω/❑. The fact that the source/drain diffusion is needed as a conductor in integrated circuits conflicts with its use as a resistor. Clearly the goal of a salicide process is to achieve “conductor-like” performance from source/drain diffusion. In these processes, a salicide block can be used to mask the silicide film thus allowing for a high-resistance source/drain diffusion where desired. The diffused resistor is found to have a voltage coefficient of resistance in the 100 to 500 ppm/V range. The parasitic capacitance to ground is also voltage dependent in this type of resistor.


    A polysilicon resistor is shown in Fig. 2.4-4(b). This resistor is surrounded by thick oxide and has a sheet resistance in the range of 30 to 200 Ω/❑ depending upon doping levels. For a polysilicide process, the effective resistance of the polysilicon is about 10 Ω/❑.


    An n-well resistor shown in Fig. 2.4-4(c) is made up of a strip of n-well contacted at both ends with $\mathfrak { n } ^ { + }$ source/drain diffusion. This type of resistor has a resistance of 1 to 10 kΩ/❑ and a high value for its voltage coefficient. In cases where accuracy is not required, such as pull-up resistors, or protection resistors, this structure is very useful.'
  normalized_text: 'Three resistor types: diffused source/drain (50-150 Ohm/sq non-salicided, 5-15 salicided), polysilicon (30-200 Ohm/sq), n-well (1-10 kOhm/sq, high voltage coefficient, used for pull-up/protection).'
  evidence_strength: direct
