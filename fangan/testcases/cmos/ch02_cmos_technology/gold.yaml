do_not_extract:
- pattern: bracket_reference_citation
  examples:
  - '[24,25]'
  - '[12]'
  - '[1,2,3,4]'
  - '[7,8]'
  reason: inline numeric reference citations are not knowledge objects
  kind: citation_policy
- pattern: figure_or_equation_cross_reference
  examples:
  - Fig. 2.1-5
  - Fig. 2.2-1
  - Figure 2.5-3
  - Eq. (12)
  reason: cross-references to figures/equations are pointers, not objects to extract
  kind: reference
- pattern: figure_internal_label
  examples:
  - n-well implant
  - p- substrate
  - Photoresist
  - FOX
  - Si3N4
  reason: OCR'd labels inside <details> figure/cross-section blocks are not knowledge objects
  kind: figure_label
- pattern: image_markup
  examples:
  - '![](images/<hash>.jpg)'
  reason: image embeds carry no extractable text
  kind: image_markup
- pattern: out_of_chapter_cross_reference
  examples:
  - Appendix B on device characterization
  - examined in more detail in the next chapter
  - Chapter 9 Switched Capacitor Circuits
  reason: references to other chapters/appendices are not Chapter-2 objects
  kind: cross_reference
