    file: source.md
    line_start: 100
    line_end: 102
    char_start: 10706
    char_end: 13019
    viewer_only: true
  raw_text: 'The next basic processing step is ion implantation and is widely used in the fabrication of MOS components [14,15]. Ion implantation is the process by which ions of a particular dopant (impurity) are accelerated by an electric field to a high velocity and physically lodge within the semiconductor material. The average depth of penetration varies from 0.1 to 0.6 m depending on the velocity and angle at which the ions strike the silicon wafer. The path of each ion depends upon the collisions it experiences. Therefore, ions are typically implanted off-axis from the wafer so that they will experience collisions with lattice atoms thus avoiding undesirable channeling of ions deep into the silicon. An alternative method to address channeling is to implant through silicon dioxide which randomizes the implant direction before the ions enter the silicon. The ionimplantation process causes damage to the semiconductor crystal lattice leaving many of the implanted ions electrically inactive. This damage can be repaired by an annealing process in which the temperature of the semiconductor after implantation is raised to around $8 0 0 ~ ^ { \circ } \mathrm { C }$ to allow the ions to move to electrically active locations in the semiconductor crystal lattice.


    Ion implantation can be used in place of diffusion since in both cases the objective is to insert impurities into the semiconductor material. Ion implantation has several advantages over thermal diffusion. One advantage is the accurate control of doping—to within ±5%. Reproducibility is very good, making it possible to adjust the thresholds of MOS devices or to create precise resistors. A second advantage is that ion implantation is a room-temperature process, although annealing at higher temperatures is required to remove the crystal damage. A third advantage is that it is possible to implant through a thin layer. Consequently, the material to be implanted does not have to be exposed to contaminants during and after the implantation process. Unlike ion implantation, diffusion requires that the surface be free of silicon dioxide or silicon nitride layers. Finally, ion implantation allows control over the profile of the implanted impurities. For example, a concentration peak can be placed below the surface of the silicon if desired.'
  normalized_text: 'Ion implantation accelerates dopant ions into the wafer; advantages over diffusion: doping accuracy to +/-5%, room-temperature process, can implant through a thin layer, and control over the implant profile; crystal damage is repaired by annealing.'
  evidence_strength: direct
- id: A-FAB-DEP
  section_id: SEC-2.1-DEP
  atom_type: technology_process_atom
