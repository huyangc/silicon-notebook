evidence_atoms:
- id: A-INTRO-TECH
  section_id: SEC-2
  atom_type: concept_definition_atom
  source_element_id: SE-2-P0
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 745
