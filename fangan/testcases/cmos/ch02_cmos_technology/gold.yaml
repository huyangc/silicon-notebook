    viewer_only: true
  raw_text: The structure of an n-channel and p-channel MOS transistor using an n-well technology is shown in Fig. 2.3-1. The p-channel device is formed with two heavilydoped $\mathfrak { p } ^ { + }$ regions diffused into a lighter doped n- material called the well. The two $\mathfrak { p } ^ { + }$ regions are called drain and source, and are separated by a distance, L (referred to as the device length). At the surface between the drain and source lies a gate electrode that is separated from the silicon by a thin dielectric material (silicon dioxide). Similarly, the nchannel transistor is formed by two heavily doped $\mathfrak { n } ^ { + }$ regions within a lightly doped $\mathsf { p } ^ { - }$ substrate. It, too, has a gate on the surface between the drain and source separated from the silicon by a thin dielectric material (silicon dioxide). Essentially, both types of transistors are four-terminal devices as shown in Fig. 1.2-2(c,d). The B terminal is the bulk, or substrate, which contains the drain and source diffusions. For an n-well process, the p-bulk connection is common throughout the integrated circuit and is connected to $V _ { S S }$ (the most negative supply). Multiple n-wells can be fabricated on a single circuit, and they can be connected to different potentials
  normalized_text: 'An MOS transistor is a four-terminal device (G,D,S,B): source/drain are heavily-doped regions separated by length L; the gate sits over a thin SiO2 dielectric; B is the bulk/substrate (p-bulk tied to V_SS in an n-well process).'
  evidence_strength: direct
- id: A-MOS-STRONGINV
  section_id: SEC-2.3
  atom_type: concept_definition_atom
  source_element_id: SE-2.3-P-INV
