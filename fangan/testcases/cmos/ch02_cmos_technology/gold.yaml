    viewer_only: true
  raw_text: 'The final basic semiconductor fabrication process considered here is etching. Etching is the process of removing exposed (unprotected) material. The means by which some material is exposed and some is not will be considered next in discussing the subject of photolithography. For the moment, we will assume that the situation illustrated in Fig. 2.1-3(a) exists. Here we see a top layer called a film and an underlying layer. A protective layer, called a maski, covers the film except in the area which is to be etched. The objective of etching is to remove just the section of the exposed film. To achieve this, the etching process must have two important properties: selectivity, and anisotropy. Selectivity is the characteristic of the etch whereby only the desired layer is etched with no effect on either the protective layer (masking layer) or the underlying layer. Selectivity can quantified as the ratio of the desired layer etch rate to the undesired layer etch rate as given below.'
  normalized_text: 'Etching removes exposed (unprotected) material; the etch must have two important properties: selectivity and anisotropy.'
  evidence_strength: direct
