objects:
- id: CONCEPT-PN-JUNCTION
  type: Concept
  section_path: 2 > 2.2
  home_package: PKG-PN-DERIV
  payload:
    term: pn junction (step junction)
    definition: Abrupt N_D-to-N_A junction with a depletion region of fixed charge about the metallurgical junction.
  local_evidence_atom_ids:
  - A-PN-CONCEPT
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: CONCEPT-MOS-TRANSISTOR
  type: Concept
  section_path: 2 > 2.3
  home_package: PKG-MOS-VT
  payload:
    term: MOS transistor
    definition: Four-terminal (G,D,S,B) device; gate over thin SiO2; channel of length L between heavily-doped source/drain.
  local_evidence_atom_ids:
  - A-MOS-STRUCT
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: CONCEPT-STRONG-INVERSION
  type: Concept
  section_path: 2 > 2.3
  home_package: PKG-MOS-VT
  payload:
    term: strong inversion
    definition: Surface inverts to n-type when v_GS reaches V_T, forming the conducting channel.
  local_evidence_atom_ids:
  - A-MOS-STRONGINV
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: CONCEPT-SHEET-RESISTANCE
  type: Concept
  section_path: 2 > 2.6
  home_package: PKG-MATCH
  payload:
    term: sheet resistance
    definition: rho_s = rho/T (Ohm/square); resistance = number of squares x rho_s.
  local_evidence_atom_ids:
  - A-LAY-RS-13
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: TECH-OXIDATION
  type: TechnologyProcess
  section_path: 2 > 2.1 > Oxidation
  home_package: PKG-FAB-STEPS
  payload:
    name: Oxidation
    purpose: Grow SiO2 on the silicon surface (gate/field oxide).
  local_evidence_atom_ids:
  - A-FAB-OXID
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: TECH-DIFFUSION
  type: TechnologyProcess
  section_path: 2 > 2.1 > Diffusion
  home_package: PKG-FAB-STEPS
  payload:
    name: Diffusion
    purpose: Move surface impurities into the bulk; predeposition vs drive-in; defines junction depth.
  local_evidence_atom_ids:
  - A-FAB-DIFF
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: TECH-IMPLANT
  type: TechnologyProcess
  section_path: 2 > 2.1 > Ion Implantation
  home_package: PKG-FAB-STEPS
  payload:
    name: Ion implantation
    purpose: Accelerate dopant ions into the wafer; +/-5% accuracy, room-temp, profile control.
  local_evidence_atom_ids:
  - A-FAB-IMP
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: TECH-DEPOSITION
  type: TechnologyProcess
  section_path: 2 > 2.1 > Deposition
  home_package: PKG-FAB-STEPS
  payload:
    name: Deposition
    purpose: Deposit films (evaporation/sputtering/CVD/LPCVD).
  local_evidence_atom_ids:
  - A-FAB-DEP
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: TECH-ETCHING
  type: TechnologyProcess
  section_path: 2 > 2.1 > Etching
  home_package: PKG-FAB-STEPS
  payload:
    name: Etching
    purpose: Remove exposed material; characterized by selectivity and anisotropy.
  local_evidence_atom_ids:
  - A-FAB-ETCH
  supporting_context_atom_ids:
  - A-FAB-SEL-1
  - A-FAB-ANI-2
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: PROCESS-NWELL-CMOS
  type: ProcessFlow
  section_path: 2 > 2.1 > N-Well CMOS Fabrication Steps
  home_package: PKG-FAB-NWELL
  payload:
    name: N-Well silicon-gate CMOS fabrication
    steps:
    - n-well implant & drive-in
    - pad oxide
    - Si3N4 deposit & pattern (active area)
    - channel-stop field implants
    - LOCOS field oxide
    - gate oxide + polysilicon
    - LDD spacer
    - n+/p+ source/drain
    - anneal
    - BPSG
    - contact + Metal 1
    - via + Metal 2
    - passivation + pad
  local_evidence_atom_ids:
  - A-FAB-NWELL-FLOW
  - A-FAB-NW-CHSTOP
  - A-FAB-NW-LOCOS
  - A-FAB-LDD
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-BARRIER-POTENTIAL
  type: Formula
  section_path: 2 > 2.2
  home_package: PKG-PN-DERIV
  payload:
    name: barrier potential
    expression: phi_o = V_t ln(N_A N_D / n_i^2)
    variables:
      phi_o: barrier potential
      V_t: kT/q = 25.9 mV @300K
      n_i: 1.45e10/cm3
  local_evidence_atom_ids:
  - A-PN-PHI-6
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-DEPLETION-WIDTH
  type: Formula
  section_path: 2 > 2.2
  home_package: PKG-PN-DERIV
  payload:
    name: depletion-region width
    expression: x_d = [2 eps_si (N_A+N_D)/(q N_A N_D)]^(1/2)(phi_o - v_D)^(1/2)
  local_evidence_atom_ids:
  - A-PN-XD-1
  - A-PN-XN-7
  - A-PN-XP-8
  - A-PN-XD-9
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-DEPLETION-CHARGE
  type: Formula
  section_path: 2 > 2.2
  home_package: PKG-PN-DERIV
  payload:
    name: depletion charge
    expression: Q_j = A[2 eps_si q N_A N_D/(N_A+N_D)]^(1/2)(phi_o - v_D)^(1/2)
  local_evidence_atom_ids:
  - A-PN-QJ-10
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-DEPLETION-CAP
  type: Formula
  section_path: 2 > 2.2
  home_package: PKG-PN-DERIV
  payload:
    name: pn junction depletion capacitance
    expression: C_j = C_j0/[1-(v_D/phi_o)]^m
    variables:
      C_j0: zero-bias depletion capacitance
      m: grading coefficient (1/2 step, 1/3 diffused)
      v_D: applied voltage
      phi_o: barrier potential
  local_evidence_atom_ids:
  - A-PN-CJ-12
  - A-PN-CJ0-DEF
