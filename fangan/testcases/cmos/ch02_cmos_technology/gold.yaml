    viewer_only: true
  raw_text: Figure 2.5-1 shows how the BJT is implemented for a n-well process. The emitter is the source or drain diffusion of an p-channel device, the base is the n-well (with a base width of $W _ { B } )$ and the p- substrate is the collector. Because the pn junction between the nwell and the p- substrate must be reverse biased, the collector must always be connected to the most negative power-supply voltage, $V _ { S S } .$ . The BJT will still find many useful applications even though the collector is constrained. The BJT illustrated in Fig. 2.5-1 is often called a substrate BJT. The substrate BJT functions like the BJT fabricated in a process designed for BJTs. The only difference is that the collector is constrained and the base width is not well controlled, resulting in a wide variation of current gains.
  normalized_text: 'A substrate BJT in an n-well process: emitter = p+ S/D of a p-channel device, base = n-well (width W_B), collector = p- substrate; the collector is constrained to V_SS because the n-well/substrate junction must stay reverse biased.'
  evidence_strength: direct
- id: A-BJT-LATERAL
  section_id: SEC-2.5
  atom_type: component_model_atom
  source_element_id: SE-2.5-BJT-LAT
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2178
    line_end: 2178
    char_start: 142727
    char_end: 143362
  viewer_span:
    file: source.md
    line_start: 1439
    line_end: 1439
    char_start: 92651
    char_end: 93286
    viewer_only: true
  raw_text: In addition to the substrate BJT, it is also possible to have a lateral BJT. Figure 2.3-1 can be used to show how the lateral BJT can be implemented. The emitter could be the n+ source of the n-channel device, the base the p- substrate, and the collector the n- well. Although the base is constrained to the substrate potential of the chip, the emitter and collector can have arbitrary voltages. Unfortunately the lateral BJT is not very useful because of the large base width. In fact the lateral BJT is considered more as a parasitic transistor. However, this lateral BJT becomes important in the problem of latch-up of CMOS circuits
  normalized_text: A lateral BJT (emitter = n+ source, base = p- substrate, collector = n-well) has a large base width and is mostly a parasitic device; it becomes important in CMOS latch-up.
  evidence_strength: direct
- id: A-LATCHUP
  section_id: SEC-2.5
  atom_type: physical_effect_atom
  source_element_id: SE-2.5-LATCHUP
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 2180
    line_end: 2182
    char_start: 143394
    char_end: 144369
  viewer_span:
    file: source.md
    line_start: 1441
    line_end: 1443
    char_start: 93318
    char_end: 94293
    viewer_only: true
  raw_text: 'Latch-up in integrated circuits may be defined as a high current state accompanied by a collapsing or low-voltage condition. Upon application of a radiation transient or certain electrical excitations, the latched or high current state can be triggered. Latch-up can be initiated by at least three regenerative mechanisms. They are: (1) the four-layer, silicon-controlled-rectifier (SCR), regenerative switching action; (2) secondary breakdown; and (3) sustaining voltage breakdown. Because of the multiple p and n diffusions present in CMOS, they are susceptible to SCR latch-up.


    Fig. 2.5-3(a) shows a cross-section of Fig. 2.3-1 and how the PNPN SCR is formed. The schematic equivalent of Fig. 2.5-3(a) is given in Fig. 2.5-3(b). Here the SCR action is clearly illustrated. The resistor $R _ { N }$ is the n-well resistance from the base of the vertical PNP (Q 2) to $V _ { D D }$ . The resistor $R _ { P } .$ - is the substrate resistance from the base of the lateral NPN'
  normalized_text: Latch-up is a high-current / low-voltage state from a parasitic PNPN silicon-controlled-rectifier (SCR) formed by the parasitic lateral NPN and vertical PNP, with n-well resistance R_N and substrate resistance R_P.
  evidence_strength: direct
