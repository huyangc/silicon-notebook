    file: source.md
    line_start: 48
    line_end: 48
    char_start: 5918
    char_end: 6843
    viewer_only: true
  raw_text: The first basic processing step is oxide growth or oxidation [12]. Oxidation is the process by which a layer of silicon dioxide $( \mathrm { { S i O } } _ { 2 } )$ is formed on the surface of the silicon wafer. The oxide grows both into as well as on the silicon surface as indicated in Fig. 2.1-1. Typically about 56% of the oxide thickness is above the original surface while about 44% is below the original surface. The oxide thickness, designated $t _ { o x }$ , can be grown using either dry or wet techniques, with the former achieving lower defect densities. Typically oxide thickness varies from less than 150 Å for gate oxides to more than 10,000 Å for field oxides. Oxidation takes place at temperatures ranging from $7 0 0 ^ { \circ } \mathrm { C }$ to $1 1 0 0 ~ ^ { \circ } \mathrm { C }$ with the resulting oxide thickness being proportional to the temperature at which it is grown (for a fixed amount of time).
  normalized_text: Oxidation grows a SiO2 layer on the silicon surface (about 56% above, 44% below the original surface); thickness t_ox from <150 A (gate) to >10000 A (field); 700-1100 C.
  evidence_strength: direct
