    char_end: 64604
    viewer_only: true
  raw_text: When the gate voltage reaches a value called the threshold voltage, designated as $V _ { T } ,$ the substrate underneath the gate becomes inverted, i.e., it changes from a p-type to an ntype semiconductor. Consequently, an n-type channel exists between the source and drain that allows carriers to flow. In order to achieve this inversion, the surface potential must increase from its original negative value $( \phi _ { s } = \phi _ { F } )$ , to zero $( \phi _ { s } = 0 )$ , and then to a positive value $( \phi _ { s } = - \phi _ { F } )$ . The value of gate-source voltage necessary to cause this change in surface potential is defined as the threshold voltage, $V _ { T }$ . This condition is known as strong inversion.
  normalized_text: 'Strong inversion: when v_GS reaches the threshold voltage V_T the surface inverts (p-type to n-type), forming an n-channel; surface potential goes from phi_s=phi_F to phi_s=-phi_F.'
  evidence_strength: direct
