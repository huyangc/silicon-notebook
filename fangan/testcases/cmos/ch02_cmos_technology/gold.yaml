- id: A-FAB-NWELL-FLOW
  section_id: SEC-2.1-NW
  atom_type: process_flow_atom
  source_element_id: SE-2.1-NW-FLOW
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 951
