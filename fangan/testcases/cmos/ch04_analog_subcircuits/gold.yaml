- id: CIRCUIT-MOS-DIODE
  type: CircuitBlock
  section_path: 4 > 4.2
  home_package: PKG-DIODE
  payload:
    name: MOS diode / active resistor
    note: gate-drain tied, in saturation; r_out ~= 1/g_m; used in current mirrors and for level translation.
  local_evidence_atom_ids:
  - A-DIODE-DEF
  - A-DIODE-I-1
  - A-DIODE-V-2
  - A-DIODE-ROUT-3
  supporting_context_atom_ids:
  - A-INTRO-SUB
  gold_label: true
