  raw_text: These simple circuits consist of one or more transistors; they are simple; and they generally perform only one function. A subcircuit is typically combined with other simple circuits to generate a more complex circuit function. Consequently, the circuits of this and the next chapter can be considered as building blocks.
  normalized_text: Subcircuits are simple circuits of one or more transistors that perform one function; they are combined with other simple circuits to generate more complex circuit functions, so they are the building blocks of this and the next chapter.
  evidence_strength: direct
  metadata:
    context_only: true
- id: A-HIER-OPAMP
  section_id: SEC-4
  atom_type: concept_definition_atom
  source_element_id: SE-4-HIER
  source_span:
    file: CMOS_Analog_Circuit_Design_-_Allen_Holberg_mineru.md
    line_start: 4877
    line_end: 4877
    char_start: 311021
    char_end: 311744
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 1274
    char_end: 1997
    viewer_only: true
  raw_text: Working our way backward, we note that one of the stages of an op amp is the differential amplifier. The differential amplifier consists of simple circuits that might include a current sink, a current-mirror load, and a sourcecoupled pair. Another stage of the op amp is a second gain stage, which might consist of an inverter and a current-sink load. If the op amp is to be able to drive a low-impedance load, an output stage is necessary. The output stage might consist of a source follower and a current-sink load. It is also necessary to provide a stabilized bias for each of the previous stages. The biasing stage could consist of a current sink and current mirrors to distribute the bias currents to the other stages.
  normalized_text: 'Op-amp hierarchy (Fig 4.0-1): an operational amplifier is composed of biasing circuits, an input differential amplifier, a second gain stage, and an output stage. The differential amplifier consists of a current sink, a current-mirror load, and a source-coupled pair; the second gain stage of an inverter and a current-sink load; the output stage of a source follower and a current-sink load; the biasing stage of a current sink and current mirrors.'
