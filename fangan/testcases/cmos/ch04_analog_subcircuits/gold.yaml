  raw_text: A voltage $V _ { B E }$ is generated from a pn-junction diode having a temperature coefficient of approximately −2.2 mV/°C at room temperature. Also generated is a thermal voltage $V _ { t } \ ( V _ { t } \ = k \ T / q )$ which is proportional to absolute temperature (PTAT) and has a temperature coefficient of $+ 0 . 0 8 5 ~ \mathrm { m V / ^ { \circ } C }$ at room temperature. If the $V _ { t }$ voltage is multiplied by a constant K and summed with the $V _ { B E }$ voltage, then the output voltage is given as
  normalized_text: 'Bandgap principle (Fig 4.6-1): sum a V_BE from a pn-junction diode (CTAT, ~ -2.2 mV/degC at room temperature) with a thermal voltage V_t = kT/q (PTAT, ~ +0.085 mV/degC) multiplied by a constant K. Choosing K so the two temperature slopes cancel gives a near-zero temperature coefficient (~10 ppm/degC over 0-70 degC).'
  evidence_strength: direct
