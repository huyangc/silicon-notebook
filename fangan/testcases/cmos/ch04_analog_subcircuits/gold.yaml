  evidence_strength: direct
- id: CIRCUIT-CURRENT-SINK
  type: CircuitBlock
  section_path: 4 > 4.3
  home_package: PKG-CS
  payload:
    name: current sink/source
    note: two-terminal constant-current device; r_out ~= 1/(lambda I_D); requires v_OUT > V_MIN.
  local_evidence_atom_ids:
  - A-CS-DEF
  - A-CS-VMIN-1
  - A-CS-ROUT-2
  supporting_context_atom_ids:
  - A-INTRO-SUB
  - A-HIER-OPAMP
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: CIRCUIT-CASCODE-SINK
  type: CircuitBlock
  section_path: 4 > 4.3
  home_package: PKG-CS
  payload:
    name: cascode current sink
    note: common-gate stack (M2 over M1) boosting r_out by g_m2 r_ds2; high-swing variant gives V_MIN = 2 V_ON.
    composed_of:
    - common-gate device M2
    - current-sink device M1
  local_evidence_atom_ids:
  - A-CS-CASCODE-PRIN
  - A-CS-CASCODE-ROUT-7
  - A-CS-HIGHSWING
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: CIRCUIT-CURRENT-MIRROR
  type: CircuitBlock
  section_path: 4 > 4.4
  home_package: PKG-CM
  payload:
    name: current mirror
    note: two matched MOS transistors with common V_GS; i_O/i_I set by aspect ratios.
    composed_of:
    - MOS diode (M1)
    - output transistor (M2)
  local_evidence_atom_ids:
  - A-CM-DEF
  - A-CM-RATIO-3
  - A-CM-ROUT-15
  supporting_context_atom_ids:
  - A-INTRO-SUB
  - A-HIER-OPAMP
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: CIRCUIT-CURRENT-REFERENCE
  type: CircuitBlock
  section_path: 4 > 4.5
  home_package: PKG-REF
  payload:
    name: current/voltage reference
    note: bootstrap (V_T- or V_BE-referenced) source; built from current mirrors (M3/M4) forcing I_1=I_2 plus a start-up circuit; supply-independent.
    composed_of:
    - current mirror
    - reference device (V_T or V_BE)
    - resistor R
    - start-up circuit
  local_evidence_atom_ids:
  - A-REF-DEF
  - A-REF-BOOTSTRAP
  supporting_context_atom_ids:
  - A-INTRO-SUB
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: CIRCUIT-BANDGAP
  type: CircuitBlock
  section_path: 4 > 4.6
  home_package: PKG-BG
  payload:
    name: bandgap reference
    note: V_REF = V_BE + K V_t; CTAT V_BE from a BJT summed with PTAT K*V_t; ~10 ppm/degC.
    composed_of:
    - BJT (V_BE, CTAT)
    - PTAT delta-V_BE current branch
    - op amp
    - resistor ratio R2/R1
  local_evidence_atom_ids:
  - A-BG-PRINCIPLE
  - A-BG-CONV-22
  supporting_context_atom_ids:
  - A-INTRO-SUB
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMP-SWITCH-MODEL
  type: ComponentModel
  section_path: 4 > 4.1
  home_package: PKG-SW-MODEL
  payload:
    name: nonideal switch model
    elements:
    - r_ON
    - r_OFF
    - V_OS (zero for MOS)
    - I_OFF
    - I_A/I_B leakage
    - C_A,C_B,C_AB,C_AC,C_BC
  local_evidence_atom_ids:
  - A-SW-MODEL
  - A-SW-CAPS
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMP-WILSON
  type: ComponentModel
  section_path: 4 > 4.4
  home_package: PKG-CM
  payload:
    name: Wilson / regulated cascode mirror
    note: Wilson uses negative current feedback; the cascode mirror (Fig 4.4-6) boosts r_out (Eq.16); the regulated cascode reaches r_out ~ g_m^2 r^3.
  local_evidence_atom_ids:
  - A-CM-CASCODE-16
  - A-CM-WILSON
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-RON
  type: Formula
  section_path: 4 > 4.1
  home_package: PKG-SW-MODEL
  payload:
    name: switch ON resistance
    expression: r_ON = L/[K' W (V_GS - V_T - V_DS)]
    variables:
      K_prime: transconductance parameter
      W/L: aspect ratio
      V_GS: gate-source voltage
      V_T: threshold
  local_evidence_atom_ids:
  - A-SW-RON-2
  - A-SW-ID-1
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-CHARGE-FEEDTHROUGH
  type: Formula
  section_path: 4 > 4.1
  home_package: PKG-SW-CLOCK
  payload:
    name: charge-feedthrough error
    expression: 'V_error depends on regime: slow uses sqrt(pi U C_L/(2 beta)); fast uses (V_HT - beta V_HT^3/(6 U C_L))'
    condition: slow if beta V_HT^2/(2 C_L) >> U; fast if << U
  local_evidence_atom_ids:
  - A-SW-GVT-3
  - A-SW-VERR-SLOW-6
  - A-SW-VERR-FAST-8
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: hard
  evidence_strength: direct
- id: FORMULA-DIODE-ROUT
  type: Formula
  section_path: 4 > 4.2
  home_package: PKG-DIODE
  payload:
    name: MOS-diode small-signal resistance
    expression: r_out = 1/(g_m + g_mbs + g_ds) ~= 1/g_m
  local_evidence_atom_ids:
  - A-DIODE-ROUT-3
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-CS-ROUT
  type: Formula
  section_path: 4 > 4.3
  home_package: PKG-CS
  payload:
    name: current-source output resistance
    expression: r_out = (1 + lambda V_DS)/(lambda I_D) ~= 1/(lambda I_D)
  local_evidence_atom_ids:
  - A-CS-ROUT-2
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-CASCODE-ROUT
  type: Formula
  section_path: 4 > 4.3
  home_package: PKG-CS
  payload:
    name: cascode output resistance
    expression: r_out ~= (g_m2 r_ds2) r_ds1  (~ g_m r_ds^2)
    note: common-gate gain g_m2 r_ds2 multiplies the lower device r_ds1
  local_evidence_atom_ids:
  - A-CS-CASCODE-ROUT-7
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-MIRROR-RATIO
  type: Formula
  section_path: 4 > 4.4
  home_package: PKG-CM
  payload:
    name: ideal current-mirror ratio
    expression: i_O/i_I = (L1 W2)/(W1 L2)
  local_evidence_atom_ids:
  - A-CM-RATIO-3
  - A-CM-RATIO-1
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-MIRROR-ERROR
  type: Formula
  section_path: 4 > 4.4
  home_package: PKG-CM
  payload:
    name: first-order mirror gain error
    expression: i_O/i_I ~= 1 + (Delta K'/K') - 2 Delta V_T/(v_GS - V_T)
  local_evidence_atom_ids:
  - A-CM-KVT-14
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-PN-REF
  type: Formula
  section_path: 4 > 4.5
  home_package: PKG-REF
  payload:
    name: pn-junction voltage reference
    expression: V_REF = V_EB = (kT/q) ln(I/I_s); S = 1/ln(I/I_s) < 1
  local_evidence_atom_ids:
  - A-REF-PN-4
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-MOS-VT-REF
  type: Formula
  section_path: 4 > 4.5
  home_package: PKG-REF
  payload:
    name: MOS V_T-based reference
    expression: V_REF = V_T - 1/(beta R) + sqrt(2(V_DD - V_T)/(beta R) + 1/(beta^2 R^2))
  local_evidence_atom_ids:
  - A-REF-MOS-8
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-BANDGAP
  type: Formula
  section_path: 4 > 4.6
  home_package: PKG-BG
  payload:
    name: bandgap reference voltage
    expression: V_REF = V_BE + K V_t; V_REF|T0 = V_G0 + V_t0(gamma - alpha)
    variables:
      V_BE: CTAT, -2.2 mV/degC
      V_t: PTAT, kT/q
      K: scaling constant for zero tempco
      V_G0: bandgap voltage 1.205 V
  local_evidence_atom_ids:
  - A-BG-VREF-1
  - A-BG-K-16
  - A-BG-DVBE-12
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-BANDGAP-CONV
  type: Formula
  section_path: 4 > 4.6
  home_package: PKG-BG
  payload:
    name: conventional CMOS bandgap V_REF
    expression: V_REF = V_EB2 + (R2/R1) V_t ln(R2 A_E1/(R3 A_E2)); K = (R2/R1) ln(R2 A_E1/(R3 A_E2))
  local_evidence_atom_ids:
  - A-BG-CONV-22
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
