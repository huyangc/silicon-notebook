    char_start: 63690
    char_end: 63788
    viewer_only: true
  raw_text: 'The BSIM3 model addresses the following important effects seen in deep-submicron MOSFET operation:'
  normalized_text: 'BSIM3 addresses deep-submicron effects: threshold voltage reduction, mobility degradation from a vertical field, velocity saturation, drain-induced barrier lowering (DIBL), channel length modulation, subthreshold (weak inversion) conduction, source/drain parasitic resistance, and hot-electron effects on output resistance.'
  evidence_strength: direct
