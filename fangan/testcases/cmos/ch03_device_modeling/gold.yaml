    char_start: 63269
    char_end: 63688
    viewer_only: true
  raw_text: In 1994, U.C. Berkeley introduced the BSIM3 model (version 2) which, unlike the earlier BSIM models, returned to a more device-physic based modeling approach. The model is simpler to use and only has 40 dc parameters. Moreover, the BSIM3 provides good performance when applied to analog as well as digital circuit simulation. In its third version, BSIM3v3 [26], it has become the industry standard MOS transistor model.
  normalized_text: 'BSIM model lineage (UC Berkeley): BSIM1 (1984, 60 dc params, curve-fit), BSIM2 (1991, 99 dc params, better output-resistance/hot-electron modeling), BSIM3 v2 (1994, device-physics based, 40 dc params, analog+digital). BSIM3v3 has become the industry-standard MOS transistor model; detailed equations are not given due to their volume.'
  evidence_strength: direct
- id: A-CS-BSIM-EFFECTS
  section_id: SEC-3.4-BSIM
  atom_type: physical_effect_atom
  source_element_id: SE-3.4-BSIM-EFF
