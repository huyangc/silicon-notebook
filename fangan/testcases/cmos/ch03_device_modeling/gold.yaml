  raw_text: As vGS approaches $V _ { T }$ the $i _ { D } - \nu _ { G S }$ characteristics change from square-law to exponential. Whereas the region where $\nu _ { G S }$ is above the threshold is called the strong inversion region, the region below (actually, the transition between the two regions is not well defined as will be explained later) is called the subthreshold, or weak inversion region.
  normalized_text: 'Subthreshold (weak inversion) conduction: as v_GS approaches V_T the i_D - v_GS characteristic changes from square-law (strong inversion) to exponential (weak inversion). Current flows at or below threshold, contradicting the strong-inversion models.'
