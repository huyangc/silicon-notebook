  raw_text: As drain voltage increases, the channel length is reduced resulting in increased current. This phenomenon is called channel length modulation and is accounted for in the saturation model with the addition of the factor, $( 1 + \lambda \nu _ { D S } )$ where $\nu _ { D S }$ is the actual drain-source voltage and not $\nu _ { D S } ( \mathrm { s a t } )$ .
  normalized_text: As drain voltage increases the channel length is reduced, increasing current. This is channel length modulation, accounted for in the saturation model by the factor (1 + lambda v_DS), where v_DS is the actual drain-source voltage, not v_DS(sat).
  evidence_strength: direct
