  raw_text: the temperature coefficient of the threshold voltage is negative in the subthreshold region. The variation of current due to temperature of a device operating in weak inversion is dominated by the negative temperature coefficient of the threshold voltage. Therefore, for a given gate-source voltage, subthreshold current increases as the temperature increases.
  normalized_text: In weak inversion the threshold-voltage temperature coefficient is negative, so for a given v_GS the subthreshold current increases as temperature increases. Weak-inversion operation is important for low-power circuits.
  evidence_strength: direct
