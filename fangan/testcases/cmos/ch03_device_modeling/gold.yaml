objects:
- id: CONCEPT-SMALL-SIGNAL
  type: Concept
  section_path: 3 > 3.3
  home_package: PKG-SS-MODEL
  payload:
    term: small-signal model
    definition: Linear MOS model whose parameters are partial derivatives of large-signal variables at the quiescent point; valid where large-signal behavior is approximately linear.
  local_evidence_atom_ids:
  - A-SS-INTRO
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-SAH-DRAIN
  type: Formula
  section_path: 3 > 3.1
  home_package: PKG-LS-MODEL
  payload:
    name: Sah/Shichman-Hodges drain current
    expression: i_D = K'(W/L)[(v_GS - V_T) - v_DS/2] v_DS
    variables:
      K': mu_o C_ox = transconductance parameter
      W/L: aspect ratio
      V_T: threshold voltage
      v_DS: drain-source voltage
  local_evidence_atom_ids:
  - A-LS-SAH-1
  - A-LS-ID-K-12
  - A-LS-PARAMS
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-BETA
  type: Formula
  section_path: 3 > 3.1
  home_package: PKG-LS-MODEL
  payload:
    name: transconductance parameter
    expression: beta = K'(W/L) ~= (mu_o C_ox)(W/L)
  local_evidence_atom_ids:
  - A-LS-BETA-13
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-VDSSAT
  type: Formula
  section_path: 3 > 3.1
  home_package: PKG-LS-REGIONS
  payload:
    name: saturation voltage
    expression: v_DS(sat) = v_GS - V_T
    note: = V_ON; boundary between nonsaturation and saturation.
  local_evidence_atom_ids:
  - A-LS-VDSAT-15
  - A-LS-VON-20
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORMULA-ID-NONSAT
  type: Formula
  section_path: 3 > 3.1
  home_package: PKG-LS-REGIONS
  payload:
    name: nonsaturation drain current
    expression: i_D = K'(W/L)[(v_GS - V_T) - v_DS/2] v_DS, 0 < v_DS <= v_GS - V_T
  local_evidence_atom_ids:
  - A-LS-NONSAT-16
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-ID-SAT
  type: Formula
  section_path: 3 > 3.1
  home_package: PKG-LS-REGIONS
  payload:
    name: saturation drain current with channel-length modulation
    expression: i_D = K'(W/2L)(v_GS - V_T)^2 (1 + lambda v_DS)
    variables:
      lambda: channel-length modulation parameter (V^-1)
  local_evidence_atom_ids:
  - A-LS-SAT-17
  - A-LS-SAT-CLM-18
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORMULA-THRESHOLD
  type: Formula
  section_path: 3 > 3.1
  home_package: PKG-LS-MODEL
  payload:
    name: threshold voltage with body effect
    expression: V_T = V_T0 + gamma[sqrt(2|phi_F| + v_SB) - sqrt(2|phi_F|)]
  local_evidence_atom_ids:
  - A-LS-VT-2
  - A-LS-GAMMA-4
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: VAR-LAMBDA
  type: Variable
  section_path: 3 > 3.1
  home_package: PKG-LS-REGIONS
  payload:
    symbol: lambda
    name: channel-length modulation parameter
    units: V^-1
    typical: 0.04 (N) / 0.05 (P) at L=1um (Table 3.1-2)
  local_evidence_atom_ids:
  - A-LS-SAT-CLM-18
  supporting_context_atom_ids:
  - A-LS-T312
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: VAR-KPRIME
  type: Variable
  section_path: 3 > 3.1
  home_package: PKG-LS-MODEL
  payload:
    symbol: K'
    name: transconductance parameter
    expression: mu_o C_ox
    units: uA/V^2
    typical: 110 (N) / 50 (P) in saturation
  local_evidence_atom_ids:
  - A-LS-BETA-13
  - A-LS-T312
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: DERIV-REGIONS
  type: Derivation
  section_path: 3 > 3.1
  home_package: PKG-LS-REGIONS
  payload:
    name: regions of operation of the MOS drain current
    steps:
