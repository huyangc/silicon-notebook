  raw_text: Sparsity is a recurring design principle for intelligent systems, spanning from biological neural circuits (Lennie, 2003; Olshausen and Field, 1997) to modern Large Language Models (LLMs). Currently, this principle is primarily realized through Mixture-of-Experts (MoE) (Dai et al., 2024; Shazeer et al., 2017), which scales capacity via conditional computation.
  normalized_text: Sparsity is a recurring design principle for intelligent systems, spanning from biological neural circuits to modern Large Language Models (LLMs); currently this principle is primarily realized through Mixture-of-Experts (MoE), which scales capacity via conditional computation.
  evidence_strength: direct
- id: A-MOE-DEFACTO
  section_id: SEC-1
  atom_type: claim_sentence
  source_element_id: SE-1-P15
  source_span:
    file: engram_paper_mineru.md
    line_start: 15
    line_end: 15
    char_start: 2538
    char_end: 2755
  viewer_span:
    file: source.md
    line_start: 4
    line_end: 4
    char_start: 530
    char_end: 747
    viewer_only: true
  raw_text: Owing to its ability to drastically increase model size without proportional increases in compute, MoE has become the de facto standard for frontier models (Comanici et al., 2025; Guo et al., 2025; Team et al., 2025).
  normalized_text: Owing to its ability to drastically increase model size without proportional increases in compute, MoE has become the de facto standard for frontier models.
  evidence_strength: direct
- id: A-LINGUISTIC-DUALITY
  section_id: SEC-1
  atom_type: claim_sentence
  source_element_id: SE-1-P17
  source_span:
    file: engram_paper_mineru.md
    line_start: 17
    line_end: 19
    char_start: 2924
    char_end: 3261
  viewer_span:
    file: source.md
    line_start: 6
    line_end: 8
    char_start: 916
    char_end: 1253
    viewer_only: true
  raw_text: 'Specifically, language modeling entails two qualitatively different sub-tasks: compositional reasoning and knowl-


    edge retrieval. While the former demands deep, dynamic computation, a substantial portion of text—such as named entities and formulaic patterns—is local, static, and highly stereotyped (Constant et al., 2017; Erman, 2000).'
  normalized_text: 'Specifically, language modeling entails two qualitatively different sub-tasks: compositional reasoning and knowledge retrieval. While the former demands deep, dynamic computation, a substantial portion of text - such as named entities and formulaic patterns - is local, static, and highly stereotyped.'
  evidence_strength: direct
- id: A-NGRAM-LOCAL
  section_id: SEC-1
  atom_type: mechanism_sentence
  source_element_id: SE-1-P17
  source_span:
    file: engram_paper_mineru.md
    line_start: 19
    line_end: 19
    char_start: 3262
    char_end: 3496
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 1254
    char_end: 1488
    viewer_only: true
  raw_text: The effectiveness of classical N-gram models (Brants et al., 2007; Liu et al., 2024b; Nguyen, 2024) in capturing such local dependencies implies that these regularities are naturally represented as computationally inexpensive lookups.
  normalized_text: The effectiveness of classical N-gram models in capturing such local dependencies implies that these regularities are naturally represented as computationally inexpensive lookups.
  evidence_strength: direct
- id: A-NO-LOOKUP-PRIMITIVE
  section_id: SEC-1
  atom_type: claim_sentence
  source_element_id: SE-1-P17
  source_span:
    file: engram_paper_mineru.md
    line_start: 19
    line_end: 19
    char_start: 3497
    char_end: 3656
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 1489
    char_end: 1648
    viewer_only: true
  raw_text: Since standard Transformers (Vaswani et al., 2017) lack a native knowledge lookup primitive, current LLMs are forced to simulate retrieval through computation.
  normalized_text: Since standard Transformers lack a native knowledge lookup primitive, current LLMs are forced to simulate retrieval through computation.
  evidence_strength: direct
- id: A-RECONSTRUCTION-WASTE
  section_id: SEC-1
  atom_type: mechanism_sentence
  source_element_id: SE-1-P17
  source_span:
    file: engram_paper_mineru.md
    line_start: 19
    line_end: 19
    char_start: 3657
    char_end: 4065
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 1649
    char_end: 2057
    viewer_only: true
  raw_text: For instance, resolving a common multi-token entity requires consuming multiple early layers of attention and feed-forward networks (Ghandeharioun et al., 2024; Jin et al., 2025) (see Table 3). This process essentially amounts to an expensive runtime reconstruction of a static lookup table, wasting valuable sequential depth on trivial operations that could otherwise be allocated to higher-level reasoning.
  normalized_text: For instance, resolving a common multi-token entity requires consuming multiple early layers of attention and feed-forward networks (see Table 3). This process essentially amounts to an expensive runtime reconstruction of a static lookup table, wasting valuable sequential depth on trivial operations that could otherwise be allocated to higher-level reasoning.
  evidence_strength: direct
- id: A-CONDITIONAL-MEMORY
  section_id: SEC-1
  atom_type: claim_sentence
  source_element_id: SE-1-P21
  source_span:
    file: engram_paper_mineru.md
    line_start: 21
    line_end: 21
    char_start: 4067
    char_end: 4431
  viewer_span:
    file: source.md
    line_start: 10
    line_end: 10
    char_start: 2059
    char_end: 2423
    viewer_only: true
  raw_text: 'To align model architecture with this linguistic duality, we advocate for a complementary axis of sparsity: conditional memory. Whereas conditional computation sparsely activates parameters to process dynamic logic (Bengio et al., 2013; Shazeer et al., 2017), conditional memory relies on sparse lookup operations to retrieve static embeddings for fixed knowledge.'
  normalized_text: 'To align model architecture with this linguistic duality, we advocate for a complementary axis of sparsity: conditional memory. Whereas conditional computation sparsely activates parameters to process dynamic logic, conditional memory relies on sparse lookup operations to retrieve static embeddings for fixed knowledge.'
  evidence_strength: direct
- id: A-NGRAM-O1-LOOKUP
  section_id: SEC-1
  atom_type: mechanism_sentence
  source_element_id: SE-1-P21
  source_span:
    file: engram_paper_mineru.md
    line_start: 21
    line_end: 21
    char_start: 4432
    char_end: 4935
  viewer_span:
    file: source.md
    line_start: 10
    line_end: 10
    char_start: 2424
    char_end: 2927
    viewer_only: true
  raw_text: 'As a preliminary exploration of this paradigm, we revisit N-gram embeddings (Bojanowski et al., 2017) as a canonical instantiation: local context serves as a key to index a massive embedding table via constant-time $O(1)$ lookups (Huang et al., 2025a; Pagnoni et al., 2025; Tito Svenstrup et al., 2017; Yu et al., 2025). Our investigation reveals that, perhaps surprisingly, this static retrieval mechanism can serve as an ideal complement to modern MoE architecture—but only if it is properly designed.'
  normalized_text: 'As a preliminary exploration of this paradigm, we revisit N-gram embeddings as a canonical instantiation: local context serves as a key to index a massive embedding table via constant-time O(1) lookups. Our investigation reveals that, perhaps surprisingly, this static retrieval mechanism can serve as an ideal complement to modern MoE architecture - but only if it is properly designed.'
  evidence_strength: direct
