    viewer_only: true
  raw_text: 'we pre-compute a surjective function $\mathcal{P}: V \to V''$ that collapses raw token IDs into canonical


    identifiers based on normalized textual equivalence (using NFKC (Whistler, 2025), lowercasing, etc.).'
  normalized_text: 'A pre-computed surjective function P: V -> V'' collapses raw token IDs into canonical identifiers based on normalized textual equivalence (NFKC, lowercasing, etc.).'
  evidence_strength: direct
