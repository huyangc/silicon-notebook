    char_start: 4608
    char_end: 5041
    viewer_only: true
  raw_text: 'Finally, to expand the receptive field and enhance the model''s non-linearity, we introduce a short, depthwise causal convolution (Gu et al., 2022; Peng et al., 2023). Let $\tilde{\mathbf{V}} \in \mathbb{R}^{T \times d}$ denote the sequence of gated values. Using a kernel size $w$ (set to 4), dilation $\delta$ (set to the max $N$ -gram order) and SiLU activation (Elfwing et al., 2018), the final output $\mathbf{Y}$ is computed as:'
  normalized_text: A short depthwise causal convolution (kernel size w=4, dilation delta = max N-gram order) with SiLU activation expands the receptive field and enhances non-linearity.
  evidence_strength: direct
