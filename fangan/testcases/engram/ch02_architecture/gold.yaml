  payload:
    name: Deterministic retrieval decouples storage from compute
    claim: 'Retrieval indices depend solely on the input token sequence (unlike MoE runtime routing), so storage decouples from compute: training shards tables with All-to-All; inference prefetches from host memory via PCIe and overlaps with preceding-layer compute; Zipfian access motivates a multi-level cache.'
