    char_end: 1364
    viewer_only: true
  raw_text: The first phase maps local contexts to static memory entries, involving tokenizer compression and retrieving embeddings via deterministic hashing.
  normalized_text: The first phase maps local contexts to static memory entries, involving tokenizer compression and retrieving embeddings via deterministic hashing.
  evidence_strength: direct
- id: A-TC-MOTIV
  section_id: SEC-2.2-TC
  atom_type: method_sentence
  source_element_id: SE-2.2-TC
  source_span:
    file: engram_paper_mineru.md
