    line_end: 14
    char_start: 1388
    char_end: 1739
    viewer_only: true
  raw_text: While $N$ -gram models typically operate directly on tokenizer outputs, standard subword tokenizers prioritize lossless reconstruction, often assigning disjoint IDs to semantically equivalent terms (e.g., Apple vs. $\sqcup$ apple) (Kudo and Richardson, 2018; Li et al., 2023b). To maximize semantic density, we implement a vocabulary projection layer.
  normalized_text: While N-gram models typically operate on tokenizer outputs, standard subword tokenizers prioritize lossless reconstruction and assign disjoint IDs to semantically equivalent terms (e.g., Apple vs. _apple); to maximize semantic density we implement a vocabulary projection layer.
  evidence_strength: direct
- id: A-TC-PROJ
  section_id: SEC-2.2-TC
  atom_type: method_sentence
  source_element_id: SE-2.2-TC
  source_span:
