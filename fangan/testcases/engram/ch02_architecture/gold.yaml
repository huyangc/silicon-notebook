    line_end: 61
    char_start: 6132
    char_end: 6594
    viewer_only: true
  raw_text: In this work, rather than standard single-stream connections (He et al., 2016), we adopt the advanced multi-branch architecture as our default backbone, chosen for its superior modeling capabilities (Larsson et al., 2017; Szegedy et al., 2015; Xie et al., 2025; Zhu et al., 2025). A defining characteristic of this architecture is the expansion of the residual stream into M parallel branches, where information flow is modulated by learnable connection weights.
  normalized_text: Rather than standard single-stream connections, the default backbone is a multi-branch architecture that expands the residual stream into M parallel branches with information flow modulated by learnable connection weights.
  evidence_strength: direct
- id: A-MB-SHARE
  section_id: SEC-2.4
  atom_type: method_sentence
  source_element_id: SE-2.4-P2
