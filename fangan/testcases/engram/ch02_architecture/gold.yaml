  raw_text: 'The Engram module is integrated into the backbone via a residual connection: $\mathbf{H}^{(\ell)} \leftarrow \mathbf{H}^{(\ell)} + \mathbf{Y}$ , followed by the standard Attention and MoE. Crucially, Engram is not applied to every layer; its specific placement is governed by the system-level latency constraints detailed in Section 2.5.'
  normalized_text: Engram is integrated into the backbone via a residual connection H^(l) <- H^(l) + Y, followed by standard Attention and MoE; it is not applied to every layer, placement governed by system-level latency constraints (Section 2.5).
