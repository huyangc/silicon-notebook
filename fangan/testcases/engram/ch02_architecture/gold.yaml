- id: A-SYS-DECOUPLE
  section_id: SEC-2.5
  atom_type: claim_sentence
  source_element_id: SE-2.5-P1
  source_span:
    file: engram_paper_mineru.md
    line_start: 102
    line_end: 102
    char_start: 15625
    char_end: 15879
  viewer_span:
    file: source.md
    line_start: 75
    line_end: 75
    char_start: 8346
    char_end: 8600
    viewer_only: true
  raw_text: Scaling memory-augmented models is often constrained by the limited capacity of GPU high-bandwidth memory (HBM). However, the deterministic retrieval mechanism of Engram naturally supports the decoupling of parameter storage from computational resources.
  normalized_text: Scaling memory-augmented models is constrained by limited GPU HBM capacity, but the deterministic retrieval mechanism of Engram supports decoupling parameter storage from computational resources.
  evidence_strength: direct
- id: A-SYS-DETERM
  section_id: SEC-2.5
  atom_type: mechanism_sentence
  source_element_id: SE-2.5-P1
  source_span:
    file: engram_paper_mineru.md
    line_start: 102
    line_end: 102
    char_start: 15880
    char_end: 16149
  viewer_span:
    file: source.md
    line_start: 75
    line_end: 75
    char_start: 8601
    char_end: 8870
    viewer_only: true
  raw_text: Unlike MoE, which relies on runtime hidden states for dynamic routing, Engram's retrieval indices depend solely on the input token sequence. This predictability facilitates specialized optimization strategies for both training and inference, as illustrated in Figure 2.
  normalized_text: Unlike MoE, which relies on runtime hidden states for dynamic routing, Engram's retrieval indices depend solely on the input token sequence; this predictability enables specialized training and inference optimizations.
  evidence_strength: direct
- id: A-SYS-TRAIN
  section_id: SEC-2.5
  atom_type: method_sentence
  source_element_id: SE-2.5-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 104
    line_end: 104
    char_start: 16151
    char_end: 16514
  viewer_span:
    file: source.md
    line_start: 77
    line_end: 77
    char_start: 8872
    char_end: 9235
    viewer_only: true
  raw_text: During training, to accommodate large-scale embedding tables, we employ standard model parallelism by sharding the tables across available GPUs. An All-to-All communication primitive is used to gather active rows in the forward pass and dispatch gradients in the backward pass, enabling the total memory capacity to scale linearly with the number of accelerators.
  normalized_text: During training, embedding tables are sharded across GPUs; an All-to-All primitive gathers active rows in the forward pass and dispatches gradients in the backward pass, so memory capacity scales linearly with the number of accelerators.
  evidence_strength: direct
- id: A-SYS-INFER
  section_id: SEC-2.5
  atom_type: method_sentence
  source_element_id: SE-2.5-P3
  source_span:
    file: engram_paper_mineru.md
    line_start: 106
    line_end: 106
    char_start: 16516
    char_end: 16937
  viewer_span:
    file: source.md
    line_start: 79
    line_end: 79
    char_start: 9237
    char_end: 9658
    viewer_only: true
  raw_text: During inference, this deterministic nature enables a prefetch-and-overlap strategy. Since memory indices are known prior to the forward pass, the system can asynchronously retrieve embeddings from abundant host memory via PCIe. To effectively mask communication latency, the Engram module is placed at specific layers within the backbone, leveraging the computation of preceding layers as a buffer to prevent GPU stalls.
  normalized_text: 'During inference a prefetch-and-overlap strategy is used: since memory indices are known prior to the forward pass, the system asynchronously retrieves embeddings from host memory via PCIe; the Engram module is placed at specific layers so preceding-layer computation masks latency and prevents GPU stalls.'
  evidence_strength: direct
- id: A-SYS-PLACEMENT
  section_id: SEC-2.5
  atom_type: limitation_sentence
  source_element_id: SE-2.5-P3
  source_span:
    file: engram_paper_mineru.md
    line_start: 106
    line_end: 106
    char_start: 16938
    char_end: 17315
  viewer_span:
    file: source.md
    line_start: 79
    line_end: 79
    char_start: 9659
    char_end: 10036
    viewer_only: true
  raw_text: 'This necessitates a hardware-algorithm co-design strategy: while placing Engram deeper extends the compute window available for hiding latency, our ablation in Section 6.2 shows that modeling performance favors early intervention to offload local pattern reconstruction. Therefore, the optimal placement must simultaneously satisfy both modeling and system latency constraints.'
  normalized_text: 'Placement requires hardware-algorithm co-design: deeper placement extends the latency-hiding window, but the ablation in Section 6.2 shows modeling performance favors early intervention, so optimal placement must satisfy both modeling and system latency constraints.'
  evidence_strength: indirect
  metadata:
    cross_ref: Section 6.2 ablation
    requires_external_evidence: true
    external_evidence_ref: Section 6.2
- id: A-SYS-ZIPF
  section_id: SEC-2.5
  atom_type: claim_sentence
  source_element_id: SE-2.5-P4
  source_span:
    file: engram_paper_mineru.md
    line_start: 108
    line_end: 108
    char_start: 17317
    char_end: 17896
  viewer_span:
    file: source.md
    line_start: 81
    line_end: 81
    char_start: 10038
    char_end: 10617
    viewer_only: true
  raw_text: 'Furthermore, natural language N-grams inherently follow a Zipfian distribution (Chao and Zipf, 1950; Piantadosi, 2014), where a small fraction of patterns accounts for the vast majority of memory accesses. This statistical property motivates a Multi-Level Cache Hierarchy: frequently accessed embeddings can be cached in faster storage tiers (e.g., GPU HBM or Host DRAM), while the long tail of rare patterns resides in slower, high-capacity media (e.g., NVMe SSD). This stratification allows Engram to scale to massive memory capacities with minimal impact on effective latency.'
  normalized_text: 'Natural-language N-grams follow a Zipfian distribution, motivating a Multi-Level Cache Hierarchy: frequent embeddings in fast tiers (GPU HBM / Host DRAM), the long tail in slower high-capacity media (NVMe SSD), letting Engram scale to massive capacity with minimal latency impact.'
  evidence_strength: direct
