objects:
- id: METHOD-ENGRAM
  type: ArticleMethod
  section_path: 2 > 2.1
  home_package: PKG-OV
  payload:
    name: Engram
    summary: Conditional memory module augmenting a Transformer backbone by separating static pattern storage from dynamic computation; two phases (retrieval, fusion).
    phases:
    - Sparse Retrieval (Section 2.2)
    - Fusion (Section 2.3)
    integration: residual connection H^(l) <- H^(l) + Y, then Attention and MoE
  local_evidence_atom_ids:
  - A-OV-DEF
  - A-OV-PHASES
  - A-OV-ROADMAP
  supporting_context_atom_ids:
  - A-GATE-RESID
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: COMPONENT-SPARSE-RETRIEVAL
  type: ArchitectureComponent
  section_path: 2 > 2.2
  home_package: PKG-RETRIEVAL
  payload:
    name: Sparse Retrieval
    phase_of: Engram
    description: 'First phase: maps local contexts to static memory entries via tokenizer compression and deterministic hashing; produces retrieved memory e_t.'
    children:
    - COMPONENT-TOKENIZER-COMPRESSION
    - COMPONENT-MULTI-HEAD-HASHING
  local_evidence_atom_ids:
  - A-RETR-INTRO
  supporting_context_atom_ids:
  - A-OV-PHASES
  - A-OV-ROADMAP
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMPONENT-FUSION
  type: ArchitectureComponent
  section_path: 2 > 2.3
  home_package: PKG-GATING
  payload:
    name: Fusion
    phase_of: Engram
    description: 'Second phase: dynamically modulates retrieved priors with the current hidden state and refines via convolution.'
    children:
    - COMPONENT-CONTEXT-AWARE-GATING
    - COMPONENT-DEPTHWISE-CAUSAL-CONV
  local_evidence_atom_ids:
  - A-GATE-QKV
  supporting_context_atom_ids:
  - A-OV-PHASES
  - A-OV-ROADMAP
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMPONENT-TOKENIZER-COMPRESSION
  type: ArchitectureComponent
  section_path: 2 > 2.2 > Tokenizer Compression
  home_package: PKG-RETRIEVAL
  payload:
    name: Tokenizer Compression
    mechanism: 'Pre-computed surjective vocabulary projection P: V -> V'' collapsing token IDs by normalized textual equivalence (NFKC, lowercasing); forms suffix N-gram g_{t,n}.'
    effect: ~23% reduction in effective vocabulary size for a 128k tokenizer
  local_evidence_atom_ids:
  - A-TC-MOTIV
  - A-TC-PROJ
  - A-TC-REDUCTION
  - A-TC-NGRAM
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMPONENT-MULTI-HEAD-HASHING
  type: ArchitectureComponent
  section_path: 2 > 2.2 > Multi-Head Hashing
  home_package: PKG-RETRIEVAL
  payload:
    name: Multi-Head Hashing
    mechanism: K distinct hash heads per N-gram order n; each maps the compressed context to an index in table E_{n,k} (prime size M_{n,k}) via multiplicative-XOR hash phi_{n,k} (Eq.1); memory vector e_t = concatenation of retrieved embeddings (Eq.2).
    purpose: mitigate hash collisions over the intractable N-gram space
  local_evidence_atom_ids:
  - A-MH-MOTIV
  - A-MH-HEADS
  - A-MH-HASHFN
  - A-MH-CONCAT
  - A-MH-EQ1
  - A-MH-EQ2
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMPONENT-CONTEXT-AWARE-GATING
  type: ArchitectureComponent
  section_path: 2 > 2.3
  home_package: PKG-GATING
  payload:
    name: Context-aware Gating
    mechanism: h_t as Query, e_t as Key/Value source (Eq.3); scalar gate alpha_t (Eq.4); gated output v~_t = alpha_t*v_t.
    role: dynamically modulates static retrieved priors to enhance expressivity and resolve ambiguity
    consumes: retrieved memory e_t (output of Sparse Retrieval)
  local_evidence_atom_ids:
  - A-GATE-PRIOR
  - A-GATE-QKV
  - A-GATE-EQ3
  - A-GATE-EQ4
  - A-GATE-OUT
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMPONENT-DEPTHWISE-CAUSAL-CONV
  type: ArchitectureComponent
  section_path: 2 > 2.3
  home_package: PKG-GATING
  payload:
    name: Depthwise Causal Convolution
    mechanism: Short depthwise causal conv (kernel w=4, dilation = max N-gram order) with SiLU on gated values; Y = SiLU(Conv1D(RMSNorm(V~))) + V~ (Eq.5).
    role: expands receptive field and adds non-linearity within the fusion phase
  local_evidence_atom_ids:
  - A-GATE-CONV
  - A-GATE-EQ5
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: COMPONENT-MULTI-BRANCH-INTEGRATION
  type: ArchitectureComponent
  section_path: 2 > 2.4
  home_package: PKG-MULTIBRANCH
  payload:
    name: Multi-branch Integration
    mechanism: Shared sparse embedding table E and Value matrix W_V across M branches; M distinct Key matrices W_K^(m) give branch-specific gates alpha_t^(m) (Eq.6); projections fused into a single dense FP8 matmul.
    relation_to_gating: Eq.6 is the branch-specific generalization of single-stream gate Eq.4
  local_evidence_atom_ids:
  - A-MB-BACKBONE
  - A-MB-SHARE
  - A-MB-EQ6
  - A-MB-FUSE
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: EXPSETUP-MHC-M4
  type: ExperimentSetup
  section_path: 2 > 2.4
  home_package: PKG-MULTIBRANCH
  payload:
    name: Default multi-branch integration setting
    setting: Manifold-Constrained Hyper-Connections
    M: 4
    scope: all experiments unless otherwise stated
    source: Xie et al., 2025
  local_evidence_atom_ids:
  - A-MB-MHC
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: INTERMEDIATE-RETRIEVED-MEMORY
  type: IntermediateRepresentation
  section_path: 2 > 2.2
  home_package: PKG-RETRIEVAL
  payload:
    name: Retrieved memory e_t
    description: The static memory vector produced by Sparse Retrieval (concatenation of hashed N-gram embeddings) and consumed as Key/Value source by Context-aware Gating.
    produced_by: COMPONENT-SPARSE-RETRIEVAL
    consumed_by: COMPONENT-CONTEXT-AWARE-GATING
  local_evidence_atom_ids:
  - A-MH-EQ2
  - A-MH-CONCAT
  supporting_context_atom_ids:
  - A-GATE-PRIOR
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: RISK-HASH-COLLISION-POLYSEMY
  type: Risk
  section_path: 2 > 2.3
  home_package: PKG-GATING
  payload:
    name: Hash-collision / polysemy noise
    description: Static retrieved embeddings may carry noise from hash collisions or polysemy and lack contextual adaptability.
  local_evidence_atom_ids:
  - A-GATE-PRIOR
  - A-GATE-RISK
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: MECH-GATE-SUPPRESSES-NOISE
  type: MechanisticExplanation
  section_path: 2 > 2.3
  home_package: PKG-GATING
  payload:
    name: Gate suppresses contradictory memory
    explanation: When retrieved memory e_t contradicts the current context h_t, the scalar gate alpha_t tends toward zero, suppressing noise and enforcing semantic alignment.
  local_evidence_atom_ids:
  - A-GATE-MECH
  - A-GATE-EQ4
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: medium
  evidence_strength: direct
- id: FORM-EQ1-HASH-LOOKUP
  type: Formula
  section_path: '2'
  home_package: PKG-RETRIEVAL
  payload:
    name: Hash index and lookup
    expression: z_{t,n,k} = phi_{n,k}(g_{t,n}); e_{t,n,k} = E_{n,k}[z_{t,n,k}]
    tag: '1'
    role: hash_index_and_lookup
  local_evidence_atom_ids:
  - A-MH-EQ1
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORM-EQ2-MEMORY-CONCAT
  type: Formula
  section_path: '2'
  home_package: PKG-RETRIEVAL
  payload:
    name: Memory vector concatenation
    expression: e_t = concat_{n,k} e_{t,n,k}
    tag: '2'
    role: memory_vector_concat
  local_evidence_atom_ids:
  - A-MH-EQ2
  - A-MH-CONCAT
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORM-EQ3-KV-PROJECTION
  type: Formula
  section_path: '2'
  home_package: PKG-GATING
  payload:
    name: Key/Value projection
    expression: k_t = W_K e_t; v_t = W_V e_t
    tag: '3'
    role: key_value_projection
  local_evidence_atom_ids:
  - A-GATE-EQ3
  - A-GATE-WKV-DEF
  supporting_context_atom_ids: []
  gold_label: true
  difficulty: easy
  evidence_strength: direct
- id: FORM-EQ4-SCALAR-GATE
  type: Formula
  section_path: '2'
  home_package: PKG-GATING
  payload:
    name: Scalar gate
    expression: alpha_t = sigma(RMSNorm(h_t)^T RMSNorm(k_t)/sqrt d)
    tag: '4'
