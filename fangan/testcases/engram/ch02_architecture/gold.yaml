  raw_text: As shown in Figure 1, Engram is a conditional memory module designed to augment the Transformer backbone by structurally separating static pattern storage from dynamic computation.
  normalized_text: Engram is a conditional memory module designed to augment the Transformer backbone by structurally separating static pattern storage from dynamic computation (Figure 1).
  evidence_strength: direct
  metadata:
    figure: Figure 1
- id: A-OV-PHASES
  section_id: SEC-2.1
  atom_type: method_sentence
  source_element_id: SE-2.1-OV
  source_span:
    file: engram_paper_mineru.md
    line_start: 35
    line_end: 35
    char_start: 7792
    char_end: 8025
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 513
    char_end: 746
    viewer_only: true
  raw_text: 'Formally, given an input sequence $X = (x_{1}, \ldots, x_{T})$ and hidden states $\mathbf{H}^{(\ell)} \in \mathbb{R}^{T \times d}$ at layer $\ell$ , the module processes each position t in two functional phases: retrieval and fusion.'
  normalized_text: 'Given input sequence X=(x_1,...,x_T) and hidden states H^(l) at layer l, the module processes each position t in two functional phases: retrieval and fusion.'
  evidence_strength: direct
- id: A-OV-ROADMAP
  section_id: SEC-2.1
  atom_type: method_sentence
  source_element_id: SE-2.1-OV
  source_span:
    file: engram_paper_mineru.md
    line_start: 35
    line_end: 35
    char_start: 8026
    char_end: 8448
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 747
    char_end: 1169
    viewer_only: true
  raw_text: First, as detailed in Section 2.2, we extract and compress suffix N-grams to deterministically retrieve static embedding vectors via hashing. Subsequently, in Section 2.3, these retrieved embeddings are dynamically modulated by the current hidden state and refined via a lightweight convolution. Finally, we discuss the integration with multi-branch architectures in Section 2.4 and the system-level design in Section 2.5.
  normalized_text: Retrieval is detailed in Section 2.2 (extract/compress suffix N-grams, retrieve static embeddings via hashing); fusion in Section 2.3 (modulate retrieved embeddings by the hidden state, refine via convolution); multi-branch integration in Section 2.4; system-level design in Section 2.5.
  evidence_strength: direct
  metadata:
    role: phase_to_section_roadmap
- id: A-RETR-INTRO
  section_id: SEC-2.2
  atom_type: method_sentence
  source_element_id: SE-2.2-INTRO
