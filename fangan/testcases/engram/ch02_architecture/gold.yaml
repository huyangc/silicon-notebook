  conventions:
    coordinate_policy: AUTHORITATIVE coordinates are atom.source_span (file=source_file=engram_paper_mineru.md). Evaluators MUST verify source_file[source_span.char_start:char_end] == raw_text. atom.viewer_span (file=source.md) is OPTIONAL/viewer_only and MUST NOT be used as the primary evaluation coordinate.
    raw_vs_normalized: 'raw_text is a verbatim contiguous span of source_file. normalized_text renders EXACTLY that span: it may rephrase, transliterate math, and resolve in-span pronouns, but MUST NOT introduce facts/names/section-refs not inside the span. EXCEPTION: a formula_atom MAY carry a symbolic interpretation supplied by atoms in metadata.supported_by_context_atoms / interpretation_supported_by.'
    object_evidence: Each object lists local_evidence_atom_ids (atoms inside the object's home_package's chunk) and supporting_context_atom_ids (atoms from OTHER chunks needed to fully define it). The object's full evidence is the union. Package object-recall (expected_objects) is scored against local_evidence only; supporting_context atoms are NOT required to be present in the home package's input.
    expected_local_fields: For a cross-package object, a package may declare expected_local_fields[object_id] = the payload fields derivable from that package's atoms alone (the remaining fields require supporting_context atoms from other packages).
    labels: gold objects/relations use gold_label + difficulty + evidence_strength instead of decimal confidence.
    figures: figure atoms separate physical_section_id from semantic_section_ids; forward references set include_in_chapter2_core_chunks:false and are isolated in a cross_reference_block.
    external_evidence: atoms whose claim is only asserted here but proven elsewhere set requires_external_evidence:true + external_evidence_ref.
    packages: a context_package.atoms list IS the LLM input and equals its chunk's atom_ids.
  validation:
    required: 'for every atom: source_file[source_span.char_start:source_span.char_end] == raw_text'
    optional_debug: 'for every atom with viewer_span: source.md[viewer_span.char_start:viewer_span.char_end] == raw_text'
  parsing_notes:
  - Formulas render as $$...\tag{N}$$ with chapter-continuous numbering 1-6.
  - Figure 1/2/3 render as 'Figure N | ...' text paragraphs, no images; Figure 2 is preceded by stray '(a) Engram at training'/'(b) Engram at inference' subfigure labels (orig lines 81/83) -> see do_not_extract.
  - Tokenizer Compression / Multi-Head Hashing are run-in sub-headings under 2.2 -> SEC-2.2-TC / SEC-2.2-MH.
  - The 2.2 tokenizer paragraph breaks across a page boundary (orig lines 41 and 43).
