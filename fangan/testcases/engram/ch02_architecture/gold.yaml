    char_start: 6790
    char_end: 7073
    viewer_only: true
  raw_text: 'we implement a parameter-sharing strategy: a single sparse embedding table and a Value projection matrix $W_{V}$ are shared across all M branches, whereas M distinct Key projection matrices $\{\mathbf{W}_{K}^{(m)}\}_{m=1}^{M}$ are employed to enable branch-specific gating behaviors.'
  normalized_text: A parameter-sharing strategy shares a single sparse embedding table and a Value projection matrix W_V across all M branches, while M distinct Key projection matrices {W_K^(m)} enable branch-specific gating.
  evidence_strength: direct
