  raw_text: Results and Analysis. Figure 3 (left) reveals a consistent U-shaped relationship between validation loss and the allocation ratio $\rho$ . Remarkably, the Engram model achieves comparable performance to the pure MoE baseline ( $\rho = 100\%$ ) even when the MoE allocation is reduced to just $\rho \approx 40\%$ (i.e., a total of 46 experts for the 5.7B model and 43 experts for the 9.9B model).
  normalized_text: Figure 3 (left) shows a consistent U-shaped relationship between validation loss and the allocation ratio rho. The Engram model matches the pure MoE baseline (rho = 100%) even when the MoE allocation is reduced to just rho ~= 40% (46 experts for the 5.7B model and 43 experts for the 9.9B model).
  evidence_strength: direct
- id: A-ALLOC-RESULT-OPT
  section_id: SEC-3.1
  atom_type: scaling_law_result_atom
  source_element_id: SE-3.1-RESULT
  source_span:
    file: engram_paper_mineru.md
    line_start: 145
    line_end: 145
    char_start: 21324
    char_end: 21857
  viewer_span:
    file: source.md
    line_start: 37
    line_end: 37
    char_start: 3576
    char_end: 4109
    viewer_only: true
  raw_text: 'Furthermore, the pure MoE baseline proves suboptimal: reallocating roughly 20%–25% of the sparse parameter budget to Engram yields the best performance. Quantitatively, in the 10B regime ( $C = 6 \times 10^{20}$ ), validation loss improves from 1.7248 (at $\rho = 100\%$ ) to 1.7109 near the optimum of $\rho \approx 80\%$ ( $\Delta = 0.0139$ ). Crucially, the location of this optimum is stable across regimes ( $\rho \approx 75\%–80\%$ ), suggesting a robust allocation preference across the examined scales (under fixed sparsity).'
  normalized_text: 'The pure MoE baseline is suboptimal: reallocating roughly 20%-25% of the sparse parameter budget to Engram yields the best performance. In the 10B regime (C = 6 x 10^20), validation loss improves from 1.7248 (at rho = 100%) to 1.7109 near the optimum of rho ~= 80% (delta = 0.0139). The optimum is stable across regimes (rho ~= 75%-80%) under fixed sparsity.'
  evidence_strength: direct
