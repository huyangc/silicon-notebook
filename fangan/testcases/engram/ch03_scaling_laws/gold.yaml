    line_start: 13
    line_end: 15
    char_start: 1036
    char_end: 1494
    viewer_only: true
  raw_text: '- $P_{\text{tot}}$ : total trainable parameters, excluding vocabulary embedding and LM head.

    - $P_{\text{act}}$ : activated parameters per token. This quantity determines the training cost (FLOPs).

    - $P_{\text{sparse}} \triangleq P_{\text{tot}} - P_{\text{act}}$ : the inactive parameters, which represents the “free” parameter budget available for scaling model size without incurring computational cost (e.g., unselected experts or unretrieved embeddings).'
  normalized_text: 'Three parameter metrics: P_tot = total trainable parameters (excluding vocabulary embedding and LM head); P_act = activated parameters per token (determines training cost / FLOPs); P_sparse := P_tot - P_act = the inactive ''free'' parameter budget for scaling model size without incurring computational cost (e.g., unselected experts or unretrieved embeddings).'
  evidence_strength: direct
- id: A-ALLOC-CONTROL-001
  section_id: SEC-3.1
  atom_type: experiment_setup_atom
  source_element_id: SE-3.1-CONTROL
  source_span:
    file: engram_paper_mineru.md
