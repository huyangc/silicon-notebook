    char_start: 2461
    char_end: 3178
    viewer_only: true
  raw_text: 'Experimental protocol. We evaluate this trade-off at two compute regimes and maintain a constant sparsity ratio $P_{tot}/P_{act} \approx 10$ across both settings:


    - $C = 2 \times 10^{20}$ FLOPs: $P_{\text{tot}} \approx 5.7 \text{B}$ and $P_{\text{act}} = 568 \text{M}$ . The baseline ( $\rho = 1$ ) has a total of 106 experts.

    - $C = 6 \times 10^{20}$ FLOPs: $P_{\text{tot}} \approx 9.9\text{B}$ and $P_{\text{act}} = 993\text{M}$ . The baseline ( $\rho = 1$ ) has a total of 99 experts.


    For different $\rho$ , we construct the corresponding model only by adjusting the number of routed experts and the number of Engram embedding slots. All runs use the identical training pipeline and optimization hyperparameters.'
  normalized_text: 'Experimental protocol: two compute regimes with constant sparsity ratio P_tot/P_act ~= 10. C = 2 x 10^20 FLOPs: P_tot ~= 5.7B, P_act = 568M, baseline (rho = 1) has 106 experts. C = 6 x 10^20 FLOPs: P_tot ~= 9.9B, P_act = 993M, baseline (rho = 1) has 99 experts. For each rho only the routed-expert count and Engram embedding-slot count change; all runs use the identical training pipeline and optimization hyperparameters.'
  evidence_strength: direct
