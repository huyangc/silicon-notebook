    line_start: 17
    line_end: 17
    char_start: 1496
    char_end: 1943
    viewer_only: true
  raw_text: We keep $P_{tot}$ and $P_{act}$ fixed within each FLOPs budget, so that models have the same number of parameters and the same per-token FLOPs. For MoE, $P_{act}$ is determined by the top-k selected experts, while the parameters of non-selected experts contribute to $P_{sparse}$ . For Engram, only a constant number of slots are retrieved per token, so scaling the number of embedding slots increases $P_{tot}$ without increasing per-token FLOPs.
  normalized_text: 'Control: P_tot and P_act are held fixed within each FLOPs budget (same number of parameters, same per-token FLOPs). For MoE, P_act is determined by the top-k selected experts and non-selected experts contribute to P_sparse; for Engram only a constant number of slots are retrieved per token, so scaling embedding slots increases P_tot without increasing per-token FLOPs.'
  evidence_strength: direct
