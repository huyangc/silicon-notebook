  raw_text: For baselines, we compare against OverEncoding (Huang et al., 2025a), which integrates N-gram embeddings via averaging with the vocabulary embedding. We note that while other work such as SCONE (Yu et al., 2025) also investigates large-scale embeddings, it is primarily inference-focused and includes extra module (f-gram model) and additional training FLOPs, rendering it incompatible with the strict iso-compute constraints of this study.
  normalized_text: 'Baseline is OverEncoding (Huang et al., 2025a), which integrates N-gram embeddings by averaging with the vocabulary embedding. SCONE (Yu et al., 2025) is excluded: it is primarily inference-focused and adds an extra module (f-gram model) and additional training FLOPs, making it incompatible with the strict iso-compute constraints of this study.'
  evidence_strength: direct
