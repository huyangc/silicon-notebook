  raw_text: Experimental protocol. We utilize a fixed MoE backbone with $P_{tot} \approx 3B$ and $P_{act} = 568M$ , trained for 100B tokens to ensure convergence. On top of this backbone, we attach an Engram table and sweep the number of slots M from $2.58 \times 10^{5}$ to $1.0 \times 10^{7}$ (adding up to $\approx 13$ billion parameters).
