  raw_text: Engram, as an instantiation of conditional memory, is structurally complementary to the conditional computation provided by MoE experts. This section investigates the scaling properties of this duality and how to optimally allocate sparse capacity.
  normalized_text: Engram, as an instantiation of conditional memory, is structurally complementary to the conditional computation provided by MoE experts. This section investigates the scaling properties of this duality and how to optimally allocate sparse capacity.
  evidence_strength: direct
- id: A-SCALE-Q-001
  section_id: SEC-3
  atom_type: claim_sentence
  source_element_id: SE-3-Q
  source_span:
    file: engram_paper_mineru.md
    line_start: 114
    line_end: 115
    char_start: 18243
    char_end: 18640
  viewer_span:
    file: source.md
    line_start: 6
    line_end: 7
    char_start: 495
    char_end: 892
    viewer_only: true
  raw_text: '1. Allocation under Finite Constraints. When total parameters and training compute are fixed (Iso-parameter and Iso-FLOPs), how should we split the sparse capacity between MoE experts and Engram embeddings?

    2. Infinite Memory Regime. Considering the non-scaling $O(1)$ overhead of Engram, if the memory budget is relaxed or scaled aggressively, what scaling behavior does Engram exhibit by itself?'
  normalized_text: 'Two questions drive the study: (1) Allocation under finite constraints - given fixed total params and training compute (iso-parameter, iso-FLOPs), how to split sparse capacity between MoE experts and Engram embeddings; (2) Infinite memory regime - given Engram''s non-scaling O(1) overhead, what scaling behavior does Engram exhibit by itself under aggressive memory scaling.'
  evidence_strength: direct
- id: A-ALLOC-DEF-001
  section_id: SEC-3.1
  atom_type: definition_atom
  source_element_id: SE-3.1-PDEF
  source_span:
    file: engram_paper_mineru.md
    line_start: 121
    line_end: 123
    char_start: 18784
    char_end: 19242
  viewer_span:
