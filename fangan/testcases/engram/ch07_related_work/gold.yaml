evidence_atoms:
- id: A-NGRAM-ORIGIN
  section_id: SEC-7-NGRAM
  atom_type: claim_sentence
  source_element_id: SE-7-NGRAM-P1
  source_span:
    file: engram_paper_mineru.md
    line_start: 324
    line_end: 324
    char_start: 56452
    char_end: 56957
  viewer_span:
    file: source.md
    line_start: 4
    line_end: 4
    char_start: 394
    char_end: 899
    viewer_only: true
  raw_text: Originating from Shannon's framework (Shannon, 1948), N-gram models rely on local history to predict tokens, traditionally employing smoothing techniques (Katz, 1987; Kneser and Ney, 1995) to mitigate data sparsity. Despite the paradigm shift toward neural architectures (Bengio et al., 2003) for capturing long-range dependencies, the computational efficiency of N-gram lookups has been preserved in modern representation learning, as exemplified by seminal works like FastText (Bojanowski et al., 2017).
  normalized_text: N-gram models, originating from Shannon's framework, predict tokens from local history and use smoothing to mitigate data sparsity; despite the shift to neural architectures, the computational efficiency of N-gram lookups persists in modern representation learning, e.g., FastText.
  evidence_strength: direct
- id: A-NGRAM-RESURGE
  section_id: SEC-7-NGRAM
  atom_type: claim_sentence
  source_element_id: SE-7-NGRAM-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 328
    line_end: 328
    char_start: 57428
    char_end: 57768
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 1370
    char_end: 1710
    viewer_only: true
  raw_text: Recently, this paradigm has resurged as embedding scaling. While architectures such as Per-Layer Embeddings (Team, 2025) and DeepEmbed (RWKV Team, 2025) expand capacity via massive tables, a distinct line of pioneering research—most relevant to our approach—integrates compositional N-gram structures directly into the representation space.
  normalized_text: 'The N-gram paradigm has resurged as embedding scaling: Per-Layer Embeddings and DeepEmbed expand capacity via massive tables, while a distinct line of research integrates compositional N-gram structures directly into the representation space.'
  evidence_strength: direct
- id: A-NGRAM-SUPERBPE-SCONE
  section_id: SEC-7-NGRAM
  atom_type: mechanism_sentence
  source_element_id: SE-7-NGRAM-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 328
    line_end: 328
    char_start: 57769
    char_end: 57985
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 1711
    char_end: 1927
    viewer_only: true
  raw_text: 'SuperBPE (Liu et al., 2025) and SCONE (Yu et al., 2025) explicitly target high-frequency patterns: the former by merging multi-word expressions into “superword” tokens, and the latter via an auxiliary encoding model.'
  normalized_text: 'SuperBPE and SCONE explicitly target high-frequency patterns: SuperBPE merges multi-word expressions into ''superword'' tokens, while SCONE uses an auxiliary encoding model.'
  evidence_strength: direct
- id: A-NGRAM-OVERENC-BLT
  section_id: SEC-7-NGRAM
  atom_type: mechanism_sentence
  source_element_id: SE-7-NGRAM-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 328
    line_end: 328
    char_start: 57986
    char_end: 58335
  viewer_span:
    file: source.md
    line_start: 8
    line_end: 8
    char_start: 1928
    char_end: 2277
    viewer_only: true
  raw_text: In parallel, OverEncoding (Huang et al., 2025a) and Byte Latent Transformer (BLT) (Pagnoni et al., 2025) adopt hash N-gram embeddings to capture local dependencies at the token and byte levels, respectively. These studies collectively demonstrate the efficacy of scaling parameters through N-gram representations with minimal computational overhead.
  normalized_text: OverEncoding and Byte Latent Transformer (BLT) adopt hash N-gram embeddings to capture local dependencies at the token and byte levels respectively, demonstrating that parameters can be scaled through N-gram representations with minimal computational overhead.
  evidence_strength: direct
- id: A-DIFF1-PRIMITIVE
  section_id: SEC-7-NGRAM
  atom_type: claim_sentence
  source_element_id: SE-7-NGRAM-DIFF1
  source_span:
    file: engram_paper_mineru.md
    line_start: 330
    line_end: 330
    char_start: 58469
    char_end: 59257
  viewer_span:
    file: source.md
    line_start: 10
    line_end: 10
    char_start: 2411
    char_end: 3199
    viewer_only: true
  raw_text: '- First, regarding modeling and evaluation protocols. Prior approaches often treat $N$ -gram embeddings as external augmentations without validating their efficiency under strictly fair comparison protocols. For instance, SCONE (Yu et al., 2025) is inference-focused and relies on auxiliary modules that incur additional training FLOPs. Similarly, OverEncoding (Huang et al., 2025a) fails to yield meaningful improvements on sparse MoE backbones even under a non-isoparametric setting. In contrast, we treat conditional memory as a first-class modeling primitive instantiated via the carefully designed Engram module. By rigorously evaluating this design within our Sparsity Allocation framework, we demonstrate its clear advantage over strictly iso-parameter and iso-FLOPs MoE baselines.'
  normalized_text: 'First difference (modeling/evaluation): prior approaches treat N-gram embeddings as external augmentations without strictly fair protocols (SCONE is inference-focused with auxiliary modules incurring extra training FLOPs; OverEncoding fails to improve on sparse MoE backbones). In contrast, we treat conditional memory as a first-class modeling primitive via the Engram module, and within the Sparsity Allocation framework demonstrate clear advantage over strictly iso-parameter and iso-FLOPs MoE baselines.'
  evidence_strength: direct
- id: A-DIFF2-COMUDESIGN
  section_id: SEC-7-NGRAM
  atom_type: mechanism_sentence
  source_element_id: SE-7-NGRAM-DIFF2
  source_span:
    file: engram_paper_mineru.md
    line_start: 331
    line_end: 331
    char_start: 59258
    char_end: 59867
  viewer_span:
    file: source.md
    line_start: 11
    line_end: 11
    char_start: 3200
    char_end: 3809
    viewer_only: true
  raw_text: '- Second, from a system perspective, we advocate for algorithm-system co-design. Existing approaches place embeddings strictly at the input layer (Layer 0), which inherently serializes memory access and computation (Huang et al., 2025a; Yu et al., 2025). Engram, conversely, strategically injects memory into deeper layers to enable communication-computation overlap. Furthermore, by exploiting the inherent Zipfian distribution of $N$ -grams, we could maximize the utility of the hardware memory hierarchy. This holistic design allows Engram to scale to massive parameters with negligible inference overhead.'
  normalized_text: 'Second difference (system): existing approaches place embeddings strictly at the input layer (Layer 0), serializing memory access and computation. Engram instead injects memory into deeper layers to enable communication-computation overlap, and exploits the Zipfian distribution of N-grams to maximize use of the hardware memory hierarchy, scaling to massive parameters with negligible inference overhead.'
  evidence_strength: direct
- id: A-MOE-INTRO
  section_id: SEC-7-MOE
  atom_type: claim_sentence
  source_element_id: SE-7-MOE-P1
  source_span:
    file: engram_paper_mineru.md
    line_start: 333
    line_end: 335
    char_start: 59889
    char_end: 60310
  viewer_span:
    file: source.md
    line_start: 13
    line_end: 15
    char_start: 3831
    char_end: 4252
    viewer_only: true
  raw_text: 'MoE architectures decouple model capacity from computational cost by conditionally activating a sparse subset of experts per token, a paradigm introduced by Shazeer et al. (2017). Subsequent innovations such as GShard (Lepikhin et al., 2020), BASE (Lewis et al., 2021), Switch Transformer (Fedus et al., 2022) and GLaM (Du et al., 2022) enabled super-


    linear parameter scaling while maintaining constant inference costs.'
  normalized_text: MoE architectures decouple model capacity from computational cost by conditionally activating a sparse subset of experts per token (introduced by Shazeer et al., 2017); GShard, BASE, Switch Transformer and GLaM enabled super-linear parameter scaling at constant inference cost.
  evidence_strength: direct
- id: A-MOE-DEEPSEEK
  section_id: SEC-7-MOE
  atom_type: mechanism_sentence
  source_element_id: SE-7-MOE-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 335
    line_end: 335
    char_start: 60311
    char_end: 60724
  viewer_span:
    file: source.md
    line_start: 15
    line_end: 15
    char_start: 4253
    char_end: 4666
    viewer_only: true
  raw_text: More recently, DeepSeek-MoE (Dai et al., 2024) demonstrated superior efficiency, significantly outperforming dense models with equivalent active parameters via fine-grained expert segmentation and shared expert isolation. Adopting this architecture, state-of-the-art models such as DeepSeek-V3 (Liu et al., 2024a) and Kimi-k2 (Team et al., 2025) have further pushed total parameters to hundreds of billions scale.
  normalized_text: DeepSeek-MoE outperforms dense models with equivalent active parameters via fine-grained expert segmentation and shared expert isolation; adopting this architecture, DeepSeek-V3 and Kimi-k2 push total parameters to the hundreds-of-billions scale.
  evidence_strength: direct
- id: A-MEM-PARAMETRIC
  section_id: SEC-7-MEM
  atom_type: mechanism_sentence
  source_element_id: SE-7-MEM-P1
  source_span:
    file: engram_paper_mineru.md
    line_start: 337
    line_end: 337
    char_start: 60932
    char_end: 61263
  viewer_span:
    file: source.md
    line_start: 17
    line_end: 17
    char_start: 4874
    char_end: 5205
    viewer_only: true
  raw_text: Parametric memory methods, such as PKM (Lample et al., 2019), PEER (He, 2024), Selfmem (Cheng et al., 2023b), Memory+ (Berges et al., 2025) and UltraMem (Huang et al., 2025b,c), integrate large-scale, sparse key-value stores directly into the model layers, thereby significantly increasing capacity with negligible impact on FLOPs.
  normalized_text: Parametric memory methods (PKM, PEER, Selfmem, Memory+, UltraMem) integrate large-scale sparse key-value stores directly into the model layers, increasing capacity with negligible impact on FLOPs.
  evidence_strength: direct
- id: A-MEM-NONPARAMETRIC
  section_id: SEC-7-MEM
  atom_type: mechanism_sentence
  source_element_id: SE-7-MEM-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 337
    line_end: 337
    char_start: 61264
    char_end: 61620
  viewer_span:
    file: source.md
    line_start: 17
    line_end: 17
    char_start: 5206
    char_end: 5562
    viewer_only: true
  raw_text: Conversely, non-parametric memory approaches like REALM (Guu et al., 2020), RETRO (Borgeaud et al., 2022; Wang et al., 2023), and PlugLM (Cheng et al., 2023a) decouple knowledge storage from model processing, treating the external memory as an editable and scalable key-value store that allows the model to adapt to evolving information without retraining.
  normalized_text: Non-parametric memory approaches (REALM, RETRO, PlugLM) decouple knowledge storage from model processing, treating external memory as an editable, scalable key-value store that lets the model adapt to evolving information without retraining.
  evidence_strength: direct
- id: A-KNOW-FFN-KV
  section_id: SEC-7-KNOW
  atom_type: mechanism_sentence
  source_element_id: SE-7-KNOW-P1
  source_span:
    file: engram_paper_mineru.md
    line_start: 339
    line_end: 339
    char_start: 61812
    char_end: 62229
  viewer_span:
    file: source.md
    line_start: 19
    line_end: 19
    char_start: 5754
    char_end: 6171
    viewer_only: true
  raw_text: The Feed-Forward Networks (FFNs) are widely hypothesized to function as Key-Value memories (Geva et al., 2021). Under this framework, the first layer acts as a pattern detector ("keys") while the second layer projects specific information into the residual stream ("values"). This modularity is evidenced by the identification of specific "knowledge neurons" responsible for storing distinct facts (Dai et al., 2022).
  normalized_text: 'FFNs are hypothesized to function as key-value memories: the first layer acts as a pattern detector (''keys'') and the second projects information into the residual stream (''values''); specific ''knowledge neurons'' are identified as storing distinct facts.'
  evidence_strength: direct
- id: A-KNOW-EDITING
  section_id: SEC-7-KNOW
  atom_type: mechanism_sentence
  source_element_id: SE-7-KNOW-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 339
    line_end: 339
    char_start: 62230
    char_end: 62589
  viewer_span:
    file: source.md
    line_start: 19
    line_end: 19
    char_start: 6172
    char_end: 6531
    viewer_only: true
  raw_text: Further validation is provided by causal tracing methodologies, which map the information flow of factual recall to specific FFN layers (Meng et al., 2022). These insights have enabled precise model editing algorithms such as ROME (Meng et al., 2022) and MEMIT (Meng et al., 2023), which allow for the direct update of factual associations without retraining.
  normalized_text: Causal tracing maps the information flow of factual recall to specific FFN layers, enabling precise model-editing algorithms such as ROME and MEMIT that directly update factual associations without retraining.
  evidence_strength: direct
- id: A-KNOW-WORLDMODEL
  section_id: SEC-7-KNOW
  atom_type: claim_sentence
  source_element_id: SE-7-KNOW-P3
  source_span:
    file: engram_paper_mineru.md
    line_start: 339
    line_end: 339
    char_start: 62590
    char_end: 62833
  viewer_span:
    file: source.md
    line_start: 19
    line_end: 19
    char_start: 6532
    char_end: 6775
    viewer_only: true
  raw_text: Moreover, investigations into internal representations, such as those in Othello-GPT (Li et al., 2023a), suggest that these storage mechanisms may facilitate the emergence of structured "world models" rather than mere statistical memorization.
  normalized_text: Investigations into internal representations such as Othello-GPT suggest these storage mechanisms may facilitate the emergence of structured 'world models' rather than mere statistical memorization.
  evidence_strength: direct
