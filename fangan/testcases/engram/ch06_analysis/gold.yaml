  raw_text: where $K = XX^{\top}$ and $L = YY^{\top}$ denote the Gram matrices (using a linear kernel) and HSIC is Hilbert-Schmidt Independence Criterion (Gretton et al., 2005). We employ a minibatch implementation with an unbiased estimator of HSIC (Davari et al., 2023) and evaluate on the Few-NERD dataset (Ding et al., 2021), extracting hidden states corresponding to the final token of named entities.
  normalized_text: K = X X^T and L = Y Y^T are the linear-kernel Gram matrices, and HSIC is the Hilbert-Schmidt Independence Criterion; a minibatch unbiased HSIC estimator is used, evaluated on the Few-NERD dataset using hidden states of the final token of named entities.
  evidence_strength: direct
