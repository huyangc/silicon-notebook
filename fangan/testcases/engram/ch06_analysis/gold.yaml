    line_start: 58
    line_end: 58
    char_start: 7772
    char_end: 8478
    viewer_only: true
  raw_text: 'Injecting Engram early allows it to offload local pattern reconstruction before the backbone expends computational depth, aligning with the backbone''s natural hierarchical processing (Ghandeharioun et al., 2024; Jin et al., 2025; Li and Subramani, 2025; Tenney et al., 2019). However, this incurs a cost in gating precision: early hidden states have not yet aggregated sufficient global context via attention, and the parallel branches lack the representational divergence required for fine-grained modulation (Xie et al., 2025; Zhu et al., 2025). Consequently, optimal placement requires balancing (i) offloading static local patterns early and (ii) utilizing stronger contextual queries for gating later.'
  normalized_text: Injecting Engram early offloads local pattern reconstruction before the backbone expends computational depth, but early hidden states have not yet aggregated sufficient global context via attention (hurting gating precision); optimal placement balances (i) offloading static local patterns early and (ii) stronger contextual queries for gating later.
  evidence_strength: direct
