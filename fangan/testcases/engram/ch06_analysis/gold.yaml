    line_end: 8
    char_start: 556
    char_end: 833
    viewer_only: true
  raw_text: Current LLMs lack a dedicated knowledge lookup primitive and they rely on computation to simulate memory recall. As shown in Table 3, to recognize the entity "Diana, Princess of Wales", an LLM must consume multiple layers of Attention and FFNs to progressively compose features
  normalized_text: Current LLMs lack a dedicated knowledge lookup primitive and rely on computation to simulate memory recall; as shown in Table 3, recognizing the entity "Diana, Princess of Wales" requires consuming multiple layers of Attention and FFNs to progressively compose features.
  evidence_strength: direct
- id: A-DEPTH-HYP
  section_id: SEC-6.1
  atom_type: claim_sentence
  source_element_id: SE-6.1-P2
  source_span:
