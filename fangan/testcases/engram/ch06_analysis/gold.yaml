  raw_text: By projecting each intermediate layer's hidden state with the final LM Head, we compute the Kullback–Leibler divergence (Kullback and Leibler, 1951) between the intermediate output distribution and the model's final output distribution. This metric quantifies how close a latent representation is to being “prediction-ready”
