  raw_text: Following the pre-training stage, we apply YaRN (Peng et al., 2024) for context window extension in a 32768-token context training stage for 5,000 steps (30B tokens of high-quality, long-context data). The hyper-parameters are scale $s = 10, \alpha = 1, \beta = 32$ and the scaling factor f = 0.707.
  normalized_text: Following the pre-training stage, we apply YaRN (Peng et al., 2024) for context window extension in a 32768-token context training stage for 5,000 steps (30B tokens of high-quality, long-context data). The hyper-parameters are scale s = 10, alpha = 1, beta = 32 and the scaling factor f = 0.707.
  evidence_strength: direct
  metadata:
    role: training_details
    method: YaRN context extension (DeepSeek-V3 strategy)
