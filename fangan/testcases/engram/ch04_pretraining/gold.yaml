- id: A-RES-SPARSE-DENSE
  section_id: SEC-4.2
  atom_type: result_sentence
  source_element_id: SE-4.2-P1
  source_span:
    file: engram_paper_mineru.md
    line_start: 188
    line_end: 188
    char_start: 32430
    char_end: 32779
  viewer_span:
    file: source.md
    line_start: 32
    line_end: 32
    char_start: 8392
    char_end: 8741
    viewer_only: true
  raw_text: First, consistent with prior literature (Borgeaud et al., 2022; He, 2024; Shazeer et al., 2017), sparse architectures demonstrate superior scaling laws compared to dense models. Under the same training compute budget, all three sparse variants (MoE-27B, Engram-27B/40B) significantly outperform the iso-FLOPs Dense-4B baseline across all benchmarks.
  normalized_text: 'Consistent with prior literature, sparse architectures demonstrate superior scaling laws compared to dense models: under the same training compute budget all three sparse variants (MoE-27B, Engram-27B/40B) significantly outperform the iso-FLOPs Dense-4B baseline across all benchmarks.'
  evidence_strength: direct
- id: A-RES-ENGRAM-VS-MOE
  section_id: SEC-4.2
  atom_type: result_sentence
  source_element_id: SE-4.2-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 194
    line_end: 194
    char_start: 34553
    char_end: 35060
  raw_text: 'More importantly, Engram-27B consistently improves over the iso-parameter and iso-FLOPs MoE-27B baseline. Interestingly, these gains are not limited to knowledge-intensive tasks (e.g., MMLU: +3.0, MMLU-Pro: +1.8, CMMLU: +4.0), where memory capacity is intuitively beneficial. We observe even more significant improvements in general-reasoning domains (e.g., BBH: +5.0, ARC-Challenge: +3.7, DROP: +3.3), as well as code and mathematical reasoning (e.g., HumanEval: +3.0, MBPP: +1.6, GSM8K: +2.2, MATH: +2.4).'
  normalized_text: Engram-27B consistently improves over the iso-parameter, iso-FLOPs MoE-27B baseline. Gains are not limited to knowledge tasks (MMLU +3.0, MMLU-Pro +1.8, CMMLU +4.0) but extend to general reasoning (BBH +5.0, ARC-Challenge +3.7, DROP +3.3) and code/math (HumanEval +3.0, MBPP +1.6, GSM8K +2.2, MATH +2.4).
  evidence_strength: direct
  metadata:
    out_of_viewer_slice: true
    note: Section 4.2 prose that MinerU rendered after Table 2 (line 194); authoritative source_span only, no viewer_span (outside the 158-189 viewer slice).
- id: A-RES-CLAIM
  section_id: SEC-4.2
  atom_type: result_sentence
  source_element_id: SE-4.2-P2
  source_span:
    file: engram_paper_mineru.md
    line_start: 194
    line_end: 194
    char_start: 35211
    char_end: 35433
  raw_text: These results support our hypothesis that introducing a dedicated knowledge lookup primitive improves representation efficiency beyond what can be achieved by allocating the entire sparse budget to conditional computation.
  normalized_text: These results support the hypothesis that a dedicated knowledge-lookup primitive improves representation efficiency beyond allocating the entire sparse budget to conditional computation.
  evidence_strength: direct
  metadata:
    out_of_viewer_slice: true
    note: Section 4.2 conclusion sentence rendered after Table 2 (line 194); source_span only.
- id: A-RES-ENGRAM40
  section_id: SEC-4.2
  atom_type: result_sentence
  source_element_id: SE-4.2-P3
  source_span:
    file: engram_paper_mineru.md
    line_start: 196
    line_end: 196
    char_start: 35435
    char_end: 35892
  raw_text: Finally, scaling to Engram-40B further reduces pre-training loss and improves performance across most benchmarks. Although it does not yet strictly dominate Engram-27B on every task, this is likely an artifact of under-training. We observe that the training loss gap between Engram-40B and the baselines continues to widen towards the end of training, suggesting that the expanded memory capacity has not yet fully saturated within the current token budget.
  normalized_text: 'Engram-40B further reduces pre-training loss and improves most benchmarks but does not strictly dominate Engram-27B on every task, likely an artifact of under-training: the training-loss gap to the baselines keeps widening toward the end of training, so the expanded memory capacity is not yet saturated within the token budget.'
  evidence_strength: direct
  metadata:
    out_of_viewer_slice: true
    note: Section 4.2 prose rendered after Table 2 (line 196); source_span only.
