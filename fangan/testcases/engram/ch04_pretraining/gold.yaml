# within-span normalized_text, Table 1 atomized as caption + header <tr> + anchored <tr>/<td> row
# substrings (NUMERIC over-span audited), object evidence split into local/supporting + home_package,
# per-chunk context_packages with expected_objects, gold_label/difficulty/evidence_strength
