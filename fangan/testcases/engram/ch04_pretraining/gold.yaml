  raw_text: Each block integrates a Multi-head Latent Attention (MLA) (DeepSeek-AI et al., 2024) with 32 heads, connected to FFNs via mHC (Xie et al., 2025) with an expansion rate of 4. All models are optimized using Muon (Jordan et al., 2024; Team et al., 2025)
  normalized_text: 'Shared backbone (30-block Transformer, hidden size 2560): each block uses Multi-head Latent Attention (MLA) with 32 heads, connected to FFNs via mHC with an expansion rate of 4; all models are optimized using Muon.'
  evidence_strength: direct
  metadata:
