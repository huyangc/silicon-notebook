  raw_text: Engram-40B retains the same backbone and computation budget as Engram-27B but scales the sparse embedding module to 18.5B parameters (totaling 39.5B parameters). This model is designed to investigate the scaling properties of Engram.
  normalized_text: Engram-40B keeps the same backbone and compute budget as Engram-27B but scales the sparse embedding module to 18.5B parameters (39.5B total), to investigate Engram's scaling properties.
  evidence_strength: direct
