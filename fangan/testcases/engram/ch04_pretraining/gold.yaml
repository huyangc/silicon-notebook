    viewer_only: true
  raw_text: Dense-4B serves as the baseline model. It utilizes the backbone architecture described above, incorporating a standard dense FFN into every block.
  normalized_text: 'Dense-4B is the baseline: the shared backbone with a standard dense FFN in every block.'
  evidence_strength: direct
- id: A-SETUP-MOE
  section_id: SEC-4.1
  atom_type: experiment_setup_atom
  source_element_id: SE-4.1-MOE
  source_span:
    file: engram_paper_mineru.md
    line_start: 175
    line_end: 175
    char_start: 29907
    char_end: 30205
  viewer_span:
    file: source.md
    line_start: 19
    line_end: 19
    char_start: 5869
    char_end: 6167
    viewer_only: true
  raw_text: MoE-27B replaces the standard dense FFN with a DeepSeekMoE module (Dai et al., 2024). Configured with 72 routed experts and 2 shared experts (activating the top-k = 6 routed experts per token), this model scales to 26.7B total parameters while maintaining the same activated parameters as Dense-4B.
  normalized_text: 'MoE-27B replaces the dense FFN with a DeepSeekMoE module: 72 routed experts + 2 shared experts, activating the top-k = 6 routed experts per token; 26.7B total parameters while keeping the same activated parameters as Dense-4B.'
  evidence_strength: direct
- id: A-SETUP-ENGRAM27
  section_id: SEC-4.1
  atom_type: experiment_setup_atom
  source_element_id: SE-4.1-ENGRAM27
  source_span:
    file: engram_paper_mineru.md
    line_start: 176
    line_end: 176
    char_start: 30208
    char_end: 30933
  viewer_span:
    file: source.md
    line_start: 20
    line_end: 20
    char_start: 6170
    char_end: 6895
    viewer_only: true
  raw_text: Engram-27B is strictly derived from the MoE-27B architecture to ensure fair comparison. We reduce the number of routed experts from 72 to 55 and reallocate the freed parameters to a 5.7B-parameter embedding module ( $\rho = 74.3\%$ ), keeping the total model size constant at 26.7B. Regarding the Engram configuration, we instantiate the module at layers 2 and 15 and set the maximum $N$ -gram size to 3, the number of heads to 8, and the dimension to 1280. For optimization, the embedding parameters are updated using Adam (Kingma, 2014) with a learning rate scaled by $5\times$ and no weight decay, while the convolution parameters are initialized to zero to strictly preserve the identity mapping at the start of training.
  normalized_text: Engram-27B is derived from MoE-27B by reducing routed experts from 72 to 55 and reallocating the freed parameters to a 5.7B-parameter embedding module (rho = 74.3%), keeping total model size at 26.7B. The Engram module is instantiated at layers 2 and 15, with maximum N-gram size 3, 8 heads, and dimension 1280. Embedding parameters use Adam with learning rate scaled by 5x and no weight decay; convolution parameters are zero-initialized to preserve the identity mapping at the start of training.
  evidence_strength: direct
