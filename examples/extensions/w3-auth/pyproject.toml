[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-notebook-auth-w3"
version = "0.1.0"
description = "Example W3 OAuth authorization-code provider for Silicon Notebook"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]
