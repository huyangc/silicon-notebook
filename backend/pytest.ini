[pytest]
# Keep the verified local gate bounded instead of scaling worker count with
# every host.  Tests are per-test isolated (tmp_path DB/storage/log roots).
# To debug serially or use pdb, override on the command line with `-n0`.
addopts = -n 12 --dist loadgroup
markers =
    architecture_contract: repository-wide semantic source contract
    architecture_contract_heavy: the >2s subset of architecture_contract that stays in G2 (see conftest._ARCHITECTURE_CONTRACT_HEAVY_TESTS)
    graph_index_contract: cold-start-heavy graph/index contract group
    postgres_integration: isolated opt-in PostgreSQL tests run only by scripts/check_postgres.sh
    slow: long-running scale/perf tests that build real HNSW/ANN indexes (skip with -m "not slow")
