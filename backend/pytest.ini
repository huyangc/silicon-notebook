[pytest]
# Run the suite in parallel across CPU cores by default (pytest-xdist).
# The suite is per-test isolated (tmp_path DB/storage/log roots), so this is
# safe and cuts a full local run from ~4 min to ~30 s. To debug serially or use
# pdb, override on the command line with `-n0`.
addopts = -n auto
markers =
    slow: long-running scale/perf tests that build real HNSW/ANN indexes (skip with -m "not slow")
