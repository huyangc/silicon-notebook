name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # At most three jobs: two runners share G1, then the primary runner helps
  # the third complete G3. Each job gates real tests and every one must pass.
  standard-backend:
    name: level-1-backend-primary-postgres-rest
    runs-on: ubuntu-24.04
    # Reuse the runner for the smaller PG shard after backend finishes.
    # Provisioning and migrations never overlap the offline backend step.
    timeout-minutes: 35
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.local/pip-portable-v1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin-password
          POSTGRES_DB: postgres
          # CI-only cache/WAL budgets: preserve durable real migrations while
          # avoiding small-default buffer churn and requested checkpoints.
          POSTGRES_INITDB_ARGS: --set=shared_buffers=512MB --set=max_wal_size=2GB
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data,tmpfs-size=6442450944
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Cache portable Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-py313-portable-hnsw-v1-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run standard backend primary shard
        env:
          PYTHON_BIN: python
          BACKEND_PYTEST_WORKERS: "4"
        run: bash scripts/check_backend.sh --shard-index 0 --shard-count 2

      - name: Upload backend test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-timings-shard-0
          path: |
            backend/.local/backend-shard0-junit.xml
            backend/.local/backend-shard0-metrics.json
          if-no-files-found: warn
          retention-days: 7

      - name: Provision least-privilege PostgreSQL test targets
        if: ${{ !cancelled() }}
        id: postgres-targets
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin-password
          POSTGRES_APP_PASSWORD: ci-only-app-password
        run: python backend/tests/postgres/ci_provision.py

      - name: Run PostgreSQL adapter integration gate
        if: ${{ !cancelled() }}
        env:
          PYTHON_BIN: python
          POSTGRES_CI_AUXILIARY_TARGETS_REQUIRED: "1"
          TEST_POSTGRES_DECOY_OWNER_ROLE: silicon_notebook_ci_owner_decoy
          TEST_POSTGRES_TARGETS_JSON: ${{ steps.postgres-targets.outputs.targets }}
        run: bash scripts/check_postgres.sh --shard-index 1 --shard-count 2

      - name: Record PostgreSQL storage usage
        if: always()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash backend/tests/postgres/ci_resources.sh

      - name: Upload PostgreSQL test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-test-timings-shard-1
          path: |
            backend/.local/postgres-shard1-junit.xml
            backend/.local/postgres-shard1-metrics.json
          if-no-files-found: warn
          retention-days: 7

  standard-contracts-frontend:
    name: level-1-backend-rest-contracts-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.local/pip-portable-v1
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache portable Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-py313-portable-hnsw-v1-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run standard backend remaining shard
        if: ${{ !cancelled() }}
        env:
          PYTHON_BIN: python
          BACKEND_PYTEST_WORKERS: "4"
        run: bash scripts/check_backend.sh --shard-index 1 --shard-count 2

      - name: Run standard contracts and frontend lanes
        if: ${{ !cancelled() }}
        env:
          PYTHON_BIN: python
        run: bash scripts/check.sh --lane contracts --lane frontend

      - name: Upload remaining backend test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-timings-shard-1
          path: |
            backend/.local/backend-shard1-junit.xml
            backend/.local/backend-shard1-metrics.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload contract test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-test-timings
          path: backend/.local/contracts-junit.xml
          if-no-files-found: warn
          retention-days: 7

  postgres-integration:
    name: level-3-postgres-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # This cache has never contained a -march=native wheel. Do not fall
      # back to a generic pip cache from another build policy.
      PIP_CACHE_DIR: ${{ github.workspace }}/.local/pip-portable-v1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin-password
          POSTGRES_DB: postgres
          # CI-only cache/WAL budgets: preserve durable real migrations while
          # avoiding small-default buffer churn and requested checkpoints.
          POSTGRES_INITDB_ARGS: --set=shared_buffers=512MB --set=max_wal_size=2GB
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data,tmpfs-size=6442450944
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Cache portable Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-py313-portable-hnsw-v1-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Provision least-privilege PostgreSQL test targets
        id: postgres-targets
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin-password
          POSTGRES_APP_PASSWORD: ci-only-app-password
        run: python backend/tests/postgres/ci_provision.py

      - name: Run PostgreSQL adapter integration gate
        env:
          PYTHON_BIN: python
          POSTGRES_CI_AUXILIARY_TARGETS_REQUIRED: "1"
          TEST_POSTGRES_DECOY_OWNER_ROLE: silicon_notebook_ci_owner_decoy
          TEST_POSTGRES_TARGETS_JSON: ${{ steps.postgres-targets.outputs.targets }}
        run: bash scripts/check_postgres.sh --shard-index 0 --shard-count 2

      - name: Record PostgreSQL storage usage
        if: always()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash backend/tests/postgres/ci_resources.sh

      - name: Upload PostgreSQL test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-test-timings-shard-0
          path: |
            backend/.local/postgres-shard0-junit.xml
            backend/.local/postgres-shard0-metrics.json
          if-no-files-found: warn
          retention-days: 7
