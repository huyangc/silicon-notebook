name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  standard-gate:
    name: level-1-standard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --no-cache-dir -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run standard offline gate
        env:
          PYTHON_BIN: python
          BACKEND_PYTEST_WORKERS: "4"
        run: bash scripts/check.sh

  # 前端泳道在 Node.js 的**当前**大版本上再跑一遍。`level-1-standard` 钉 Node 22,
  # 而两份 README 与部署文档承诺「Node.js ≥ 20」——没有这条泳道,承诺的上半段就无人
  # 验证:Node ≥ 24 自带的 Web Storage 全局会盖住 jsdom 那份并返回 undefined,组件
  # 测试在开发者本机整片红、CI 却全绿(真机踩过,修复见 frontend/test-support/setup.ts)。
  # 连生产构建一起跑:那次修复的第一版误引了 `jsdom` 类型,正是 `next build` 的类型
  # 检查当场抓到的。
  frontend-node-current:
    name: level-1-frontend-node26
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # 委派给 G1 用的同一个 wrapper,而不是把 `npm test` / `npm run build` 抄一遍:
      # 抄一遍的话,`scripts/check_frontend.sh` 将来加一步前置检查,这条泳道会继续绿着
      # 跑一份**旧**的清单,与 G1 和本地验证悄悄分叉(AGENTS.md「Never duplicate test
      # roots or frontend commands」)。这条泳道要换的只有 Node 版本,不是那份清单。
      - name: Run frontend lane on the current Node.js major
        run: bash scripts/check_frontend.sh

  postgres-integration:
    name: level-3-postgres-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # This cache has never contained a -march=native wheel. Do not fall
      # back to a generic pip cache from another build policy.
      PIP_CACHE_DIR: ${{ github.workspace }}/.local/pip-portable-v1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data,tmpfs-size=4294967296
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Cache portable Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-py313-portable-hnsw-v1-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Provision least-privilege PostgreSQL test targets
        id: postgres-targets
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin-password
          POSTGRES_APP_PASSWORD: ci-only-app-password
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import quote

          import psycopg
          from psycopg import sql

          role = "silicon_notebook_app"
          decoy_owner_role = "silicon_notebook_ci_owner_decoy"
          password = os.environ["POSTGRES_APP_PASSWORD"]
          targets = []
          with psycopg.connect(
              host=os.environ["PGHOST"],
              port=os.environ["PGPORT"],
              user=os.environ["PGUSER"],
              password=os.environ["PGPASSWORD"],
              dbname="postgres",
              autocommit=True,
          ) as connection:
              # Disposable in-memory storage avoids hosted-disk DDL overhead;
              # keep PostgreSQL's real commit/WAL machinery enabled.
              for setting in ("fsync", "synchronous_commit", "full_page_writes"):
                  assert connection.execute(
                      "SELECT current_setting(%s)", (setting,)
                  ).fetchone()[0] == "on", f"unexpected {setting} policy"
              connection.execute(
                  sql.SQL("CREATE ROLE {} LOGIN PASSWORD {} NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION").format(
                      sql.Identifier(role), sql.Literal(password)
                  )
              )
              connection.execute(
                  sql.SQL(
                      "CREATE ROLE {} NOLOGIN NOSUPERUSER NOCREATEDB "
                      "NOCREATEROLE NOREPLICATION"
                  ).format(sql.Identifier(decoy_owner_role))
              )
              connection.execute(
                  sql.SQL("GRANT {} TO {}").format(
                      sql.Identifier(decoy_owner_role), sql.Identifier(role)
                  )
              )
              # Migrations use a database-wide advisory lock. Each worker
              # needs its own database, not merely its own schema.
              for worker in range(4):
                  group = {}
                  for key, kind, options in (
                      ("primary", "ci", "ENCODING 'UTF8'"),
                      ("non_c", "non_c", "ENCODING 'UTF8' LOCALE_PROVIDER icu ICU_LOCALE 'en-US'"),
                      ("non_utf", "non_utf", "ENCODING 'SQL_ASCII' LC_COLLATE 'C' LC_CTYPE 'C'"),
                  ):
                      database = f"silicon_notebook_{kind}_w{worker}_test"
                      connection.execute(
                          sql.SQL("CREATE DATABASE {} WITH OWNER {} {} TEMPLATE template0").format(
                              sql.Identifier(database), sql.Identifier(role), sql.SQL(options)
                          )
                      )
                      group[key] = (
                          f"postgresql://{quote(role, safe='')}:{quote(password, safe='')}"
                          f"@{os.environ['PGHOST']}:{os.environ['PGPORT']}/{database}"
                      )
                  targets.append(group)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"targets={json.dumps(targets)}\n")
          PY

      - name: Run PostgreSQL adapter integration gate
        env:
          PYTHON_BIN: python
          POSTGRES_CI_AUXILIARY_TARGETS_REQUIRED: "1"
          TEST_POSTGRES_DECOY_OWNER_ROLE: silicon_notebook_ci_owner_decoy
          TEST_POSTGRES_TARGETS_JSON: ${{ steps.postgres-targets.outputs.targets }}
        run: bash scripts/check_postgres.sh

      - name: Record PostgreSQL storage usage
        if: always()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" sh -c '
            df -h "$PGDATA"
            if [ -r /sys/fs/cgroup/memory.peak ]; then
              printf "PostgreSQL container peak memory (bytes): "
              cat /sys/fs/cgroup/memory.peak
            fi
          '

      - name: Upload PostgreSQL test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-test-timings
          path: backend/.local/postgres-junit.xml
          if-no-files-found: warn
          retention-days: 7
