name: Daily Extended Gate

on:
  schedule:
    # 18:17 UTC = 02:17 Asia/Shanghai on the following calendar day.
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-gate:
    name: level-2-extended
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --no-cache-dir -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run level-2 extended gate
        env:
          PYTHON_BIN: python
          BACKEND_PYTEST_WORKERS: "4"
        run: bash scripts/check_extended.sh
