name: Daily Extended Gate

on:
  schedule:
    # 18:17 UTC = 02:17 Asia/Shanghai on the following calendar day.
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-extended-${{ github.ref }}
  cancel-in-progress: true

# G2 is G1 plus the complement in scripts/check_extended.sh, in at most three
# jobs. G1 runs as in ci.yml (the backend lane alone, then contracts and
# frontend together), the contracts-and-frontend job also forces the frontend
# lane's parallel path, and the complement job runs check_extended.sh with
# --complement-only. One 4-vCPU runner running G1 and then the complement in
# sequence no longer fits a job timeout: from 2026-10-07 every single-job run
# was cancelled at 25 minutes. There is no summary job: the workflow passes
# only when all three jobs pass.
#
# Python dependencies are installed without pip's wheel cache on purpose (see
# docs/development.md): a cached locally built hnswlib wheel can crash with
# SIGILL on a runner with different CPU features.
jobs:
  extended-backend:
    name: level-2-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --no-cache-dir --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run standard backend lane
        env:
          PYTHON_BIN: python
          BACKEND_PYTEST_WORKERS: "4"
        run: bash scripts/check_backend.sh

      - name: Upload backend test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-backend-test-timings
          path: |
            backend/.local/backend-junit.xml
            backend/.local/backend-metrics.json
          if-no-files-found: warn
          retention-days: 7

  extended-contracts-frontend:
    name: level-2-contracts-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --no-cache-dir --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run standard contracts and frontend lanes
        env:
          PYTHON_BIN: python
        run: bash scripts/check.sh --lane contracts --lane frontend

      # check_frontend.sh runs its four step groups concurrently only on
      # hosts with at least eight CPUs; CI runners have fewer, so the step
      # above takes the sequential path. Force the parallel path through the
      # same wrapper so it has CI coverage too. It runs even when the step
      # above failed, so one run reports both paths.
      - name: Run frontend lane on its parallel path
        if: ${{ !cancelled() }}
        env:
          FRONTEND_LANE_PARALLEL: "1"
        run: bash scripts/check_frontend.sh

      - name: Upload contract test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-contracts-test-timings
          path: backend/.local/contracts-junit.xml
          if-no-files-found: warn
          retention-days: 7

  extended-complement:
    name: level-2-complement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --no-cache-dir --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run level-2 complement
        env:
          PYTHON_BIN: python
          BACKEND_PYTEST_WORKERS: "4"
        run: bash scripts/check_extended.sh --complement-only

      - name: Upload extended backend test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-backend-extended-test-timings
          path: |
            backend/.local/backend-extended-junit.xml
            backend/.local/backend-extended-metrics.json
          if-no-files-found: warn
          retention-days: 7
